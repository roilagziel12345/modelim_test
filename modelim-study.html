<style>
/* Layout: a study notebook — brand row + scrollable topic tab strip, one reading column (~70ch), worked examples as fold-out cards, highlighter marks on repeated exam items */
:root{
  --bg:#F3F4F0; --surface:#FFFFFF; --ink:#17201C; --muted:#5A6862; --line:#D8DDD8;
  --accent:#1E58B8; --accent-soft:#E3ECFA; --mark:#FFE16B; --mark-ink:#17201C;
  --ok:#23784A; --ok-soft:#E1F2E7; --bad:#B2291F; --bad-soft:#FBE6E3; --u:#E6E9E5;
  --f-display:"Frank Ruhl Libre","David","Times New Roman",serif;
  --f-body:"IBM Plex Sans Hebrew","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#1A201D; --ink:#E5EBE7; --muted:#9AA8A1; --line:#2D3632;
  --accent:#86ABF0; --accent-soft:#1E2A40; --mark:#8A7414; --mark-ink:#FFF6CF;

:root[data-theme="dark"]{
  --bg:#111513; --surface:#1A201D; --ink:#E5EBE7; --muted:#9AA8A1; --line:#2D3632;
  --accent:#86ABF0; --accent-soft:#1E2A40; --mark:#8A7414; --mark-ink:#FFF6CF;

*{box-sizing:border-box}
html{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7}

.opt.bad{background:var(--bad-soft);border-color:var(--bad)}

.counter{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}

.topiccards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}

.tcard:hover{border-color:var(--accent)}
.tcard .tn{font-family:var(--f-display);font-weight:700;font-size:18px}

.tcard .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
details.exam{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 16px}
details.exam summary{cursor:pointer;padding:12px 0;font-weight:600;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
details.exam summary span{color:var(--muted);font-weight:400;font-size:14px}
details.exam[open]{padding-bottom:16px}
.trick{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.trick:last-child{border-bottom:0}

.svgbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0 14px;overflow-x:auto}
.svgbox svg{display:block;margin:0 auto;max-width:100%;height:auto}
.svgbox .cap{font-size:13px;color:var(--muted);text-align:center;margin-top:4px}
/* tools */
.tool{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:16px 18px;margin:12px 0}
.tool .tt{font-family:var(--f-display);font-weight:700;font-size:19px;margin-bottom:4px}
.tool .td{font-size:14px;color:var(--muted);margin-bottom:12px}
.tool label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:3px}
.tool input[type=text],.tool select,.tool textarea{font:inherit;font-family:var(--f-mono);font-size:15px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 10px;width:100%;direction:ltr;text-align:left}
.tool select{font-family:var(--f-body);direction:rtl;text-align:right}
.tool textarea{min-height:110px;resize:vertical}
.tool .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:10px}
.tool .out{margin-top:12px;font-size:15px}
.wordlist{font-family:var(--f-mono);font-size:14px;direction:ltr;text-align:left;background:var(--bg);border-radius:7px;padding:10px;line-height:1.9;word-break:break-all;max-height:240px;overflow:auto}
.wordlist span{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 6px;margin:2px}
.verdict{font-weight:700}
.verdict.y{color:var(--ok)} .verdict.n{color:var(--bad)}
.ttab{direction:ltr}
.ttab td,.ttab th{text-align:center;font-family:var(--f-mono)}
.ttab tr.cur td{background:var(--accent-soft)}
.ttab td.hit{background:var(--mark);color:var(--mark-ink);font-weight:700}
.path{font-family:var(--f-mono);direction:ltr;text-align:left;background:var(--bg);border-radius:7px;padding:8px 10px;overflow-x:auto;white-space:nowrap;margin:8px 0}
.path b{color:var(--accent)}
.zword{font-family:var(--f-mono);font-size:20px;direction:ltr;text-align:left;letter-spacing:.06em;overflow-x:auto;white-space:nowrap;padding:6px 0}
.zword .u{background:var(--u)} .zword .v{background:var(--mark);color:var(--mark-ink)} .zword .w{background:var(--accent-soft)}
.range{display:flex;align-items:center;gap:8px}
.range input{flex:1;accent-color:var(--accent)}
.range output{font-family:var(--f-mono);min-width:2ch}
.stackviz{display:flex;gap:2px;direction:ltr;font-family:var(--f-mono)}
.stackviz span{border:1px solid var(--line);background:var(--bg);padding:0 5px;border-radius:3px}
@media (max-width:520px){.frow{grid-template-columns:110px 1fr 34px}.brand small{display:none}h2{font-size:23px}}
@media (prefers-reduced-motion:no-preference){.q,.box,.tcard{transition:border-color .15s}}

<script>
/* =====================================================================
   TOPICS — each topic: sections (title + html), tool id
   Math inside «…» is rendered LTR in mono; ^{..} sup, _{..} sub, !{..} overline

const TOPICS = [
/* ------------------------------------------------------------------ 1 */
{id:'lang', name:'שפות ופעולות', short:'מילים, שרשור, «L^*», «L^+», היפוך', tool:'lang',
sections:[
{t:'למה זה בכלל הקורס', h:`
<p>כל הקורס עוסק בשאלה אחת: <b>איזו "מכונה" מסוגלת לזהות איזו קבוצת מילים?</b></p>
<p>נניח שיש בעיה כמו "האם במילה יש מספר זוגי של a-ים?". אוספים את כל המילים שהתשובה עליהן "כן", וקוראים לאוסף הזה <b>שפה</b>. אחר כך שואלים: האם מכונה עם זיכרון סופי (אוטומט) יכולה להכריע את זה? האם צריך מחסנית? האם אפילו מחסנית לא מספיקה?</p>
<p>לכן כמעט כל שאלה במבחן היא אחת מאלה:</p>
<ul>
<li><b>לבנות</b> מכונה, ביטוי או דקדוק לשפה נתונה.</li>
<li><b>לזהות</b> איזו שפה מכונה, ביטוי או דקדוק נתונים מקבלים.</li>
<li><b>להוכיח</b> ששפה <i>אינה</i> במחלקה מסוימת (לא רגולרית, לא ח״ה).</li>
<li><b>לסווג</b>: מה קורה לשפה אחרי פעולה (איחוד, משלים, «*»).</li>
</ul>`},
{t:'מילים: המושגים הבסיסיים', h:`
<div class="tscroll"><table>
<tr><th>מושג</th><th>הגדרה</th><th>דוגמה</th></tr>
<tr><td>א״ב «Σ»</td><td>קבוצה סופית של סימנים</td><td>«Σ={a,b}»</td></tr>
<tr><td>מילה</td><td>רצף סופי של סימנים מ-«Σ»</td><td>«abba», «b»</td></tr>
<tr><td>«ε»</td><td>המילה הריקה, באורך 0</td><td>«|ε|=0»</td></tr>
<tr><td>«|w|»</td><td>אורך המילה</td><td>«|abba|=4»</td></tr>
<tr><td>«#_a(w)»</td><td>מספר ההופעות של a ב-w</td><td>«#_a(abba)=2»</td></tr>
<tr><td>«w^R»</td><td>המילה בסדר הפוך</td><td>«(aab)^R=baa»</td></tr>
<tr><td>«Σ^*»</td><td>כל המילים מעל «Σ», כולל «ε»</td><td>«{ε,a,b,aa,ab,…}»</td></tr>
<tr><td>«Σ^+»</td><td>כל המילים חוץ מ-«ε»</td><td></td></tr>
<tr><td>«Σ^n»</td><td>המילים באורך n בדיוק</td><td>«|{a,b}^3|=8»</td></tr>
</table></div>
<h3>רישא, סיפא, תת-מילה</h3>
<p>עבור «w=abc»:</p>
<ul>
<li><b>רישות</b> (התחלות): «ε, a, ab, abc».</li>
<li><b>סיפות</b> (סופים): «ε, c, bc, abc».</li>
<li><b>תתי-מילים</b> (רצף רציף מכל מקום): «ε, a, b, c, ab, bc, abc». המילה ac <i>אינה</i> תת-מילה, כי היא לא רציפה.</li>
</ul>
<p>רישא <b>אמיתית</b> היא רישא שאינה המילה כולה.</p>
<h3>שפה</h3>
<p>שפה היא <b>כל</b> תת-קבוצה של «Σ^*», סופית או אינסופית. דוגמאות:</p>
<ul>
<li>«∅»: השפה הריקה, שאין בה אף מילה.</li>
<li>«{ε}»: שפה עם מילה אחת, המילה הריקה. <mark>זה לא אותו דבר כמו «∅»!</mark></li>
<li>«{a^nb^n | n≥0} = {ε, ab, aabb, aaabbb, …}».</li>
<li>«{w∈{a,b}^* | #_a(w)=#_b(w)}»: גם abab וגם ba נמצאות בה. הסדר לא משנה, רק הכמויות.</li>
</ul>
<p>על הסימון: «a^n» הוא a שחוזרת n פעמים. למשל «a^3=aaa», «a^0=ε». גם «(ab)^2=abab».</p>`},
{t:'פעולות על שפות', h:`
<h3>פעולות של קבוצות</h3>
<p>איחוד «∪», חיתוך «∩», הפרש «−», משלים «!{L}=Σ^*−L», והפרש סימטרי «AΔB» (מילים שנמצאות בדיוק באחת מהשתיים).</p>
<h3>שרשור</h3>
<p>«L_1·L_2={xy | x∈L_1, y∈L_2}»: לוקחים מילה מהראשונה ומדביקים אחריה מילה מהשנייה, <b>בכל הצירופים</b>.</p>
<details class="wex"><summary><span class="wl">דוגמה</span><span class="wq">חשבו את «{a,ab}·{b,ε}»</span></summary><div>
<p>עוברים על כל הזוגות:</p>
<ul><li>«a·b=ab», «a·ε=a»</li><li>«ab·b=abb», «ab·ε=ab»</li></ul>
<p>התוצאה: «{a, ab, abb}». המילה ab הופיעה פעמיים, אבל בקבוצה היא נספרת פעם אחת.</p></div></details>
<details class="wex"><summary><span class="wl">דוגמה</span><span class="wq">מה זה «∅·L»? ומה זה «{ε}·L»?</span></summary><div>
<p>«∅·L=∅»: אין מילה ראשונה לבחור, ולכן אין אף צירוף.</p>
<p>«{ε}·L=L»: מדביקים «ε» לפני כל מילה, וזה לא משנה כלום.</p>
<p>כלומר «∅» מתנהג כמו 0 בכפל, ו-«{ε}» מתנהג כמו 1.</p></div></details>
<h3>חזקה וסגור קליני</h3>
<ul>
<li>«L^0={ε}», «L^1=L», «L^2=L·L», «L^3=L·L·L»…</li>
<li>«L^*=L^0∪L^1∪L^2∪…»: שרשור של <b>0 או יותר</b> מילים מ-L. לכן תמיד «ε∈L^*».</li>
<li>«L^+=L^1∪L^2∪…»: שרשור של <b>1 או יותר</b> מילים.</li>
</ul>
<div class="callout warn"><b>טעות נפוצה:</b> «L^2» <i>אינה</i> «{ww | w∈L}». בשרשור אפשר לבחור שתי מילים <b>שונות</b>. עבור «L={a,b}»: «L^2={aa,ab,ba,bb}», אבל «{ww}={aa,bb}».</div>
<details class="wex"><summary><span class="wl">דוגמה</span><span class="wq">חשבו את «{a,ab}^2»</span></summary><div>
<p>«a·a=aa», «a·ab=aab», «ab·a=aba», «ab·ab=abab». התוצאה היא 4 מילים שונות.</p></div></details>
<details class="wex"><summary><span class="wl">דוגמה</span><span class="wq">מה זה «{a^2,a^3}^+»? (שאלת מבחן 2017)</span></summary><div>
<ol><li>כל מילה ב-«L^+» היא «a^k», כאשר k הוא סכום של 2-ים ו-3-ים (לפחות מחובר אחד).</li>
<li>אילו סכומים אפשר לקבל? 2, 3, 4=2+2, 5=2+3, 6=3+3, 7=2+2+3… כל מספר שהוא לפחות 2.</li>
<li>1 אי אפשר לקבל, ו-0 לא, כי זה «+» ולא «*».</li></ol>
<p>התשובה: «{a^n | n≥2}». (עבור «L^*» התשובה הייתה «{a^n | n≠1}».)</p></div></details>
<details class="wex"><summary><span class="wl">דוגמה</span><span class="wq">מה זה «∅^*»?</span></summary><div>
<p>«∅^0={ε}», ו-«∅^1=∅^2=…=∅». לכן «∅^*={ε}». זו הדרך היחידה לקבל שפה סופית לא ריקה מ-«*».</p></div></details>
<details class="wex"><summary><span class="wl">דוגמה</span><span class="wq">«L={ab}». מה זה «L^*»?</span></summary><div>
<p>«{ε, ab, abab, ababab, …}={(ab)^n | n≥0}». שימו לב ש-aabb <i>לא</i> בשפה.</p></div></details>
<h3>היפוך</h3>
<p>«L^R={w^R | w∈L}». למשל «{ab, aab}^R={ba, baa}». גם «(L^*)^R=(L^R)^*».</p>`},
{t:'הכללים שנשאלים במבחן', h:`
<div class="callout"><b>כלל 1, שהופיע ב-7 מבחנים:</b> «L^+=L^*» אם ורק אם «ε∈L».<br>
<b>למה?</b> ההבדל היחיד בין השתיים הוא «L^0={ε}». אם «ε∈L», אז «ε» כבר נמצאת ב-«L^+» ואין הבדל. אם «ε∉L», אז אי אפשר לקבל את «ε» משרשור של מילה אחת או יותר, כי כל מילה כזו לא ריקה.</div>
<details class="wex"><summary><span class="wl">תרגול</span><span class="wq">לאילו מהשפות «L^+=L^*»? «#_a mod 3=0» · «#_a>0» · אורך אי-זוגי · פלינדרומים</span></summary><div>
<ul>
<li>«#_a mod 3=0»: המילה «ε» מכילה 0 a-ים, ו-«0 mod 3=0». לכן «ε∈L» והשוויון מתקיים.</li>
<li>«#_a>0»: ב-«ε» אין a-ים, לכן «ε∉L», ולא מתקיים.</li>
<li>אורך אי-זוגי: «|ε|=0» זוגי, לכן לא מתקיים.</li>
<li>פלינדרומים: «ε^R=ε», לכן «ε» היא פלינדרום, ומתקיים.</li>
</ul>
<p>השיטה: <b>בודקים רק אם «ε» בשפה.</b></p></div></details>
<div class="callout"><b>כלל 2:</b> אם «S·R=S» ו-«S≠∅», אז «ε∈R».<br>
<b>למה?</b> ניקח את המילה <i>הקצרה ביותר</i> s ב-S. מאחר ש-«s∈S·R», יש «x∈S», «r∈R» עם «s=xr». אבל «|x|≥|s|», כי s הכי קצרה, ולכן «|r|=0», כלומר «r=ε».</div>
<div class="callout"><b>כלל 3:</b> «L^*=L» ⟺ «ε∈L» וגם L סגורה לשרשור (אם «x,y∈L», אז «xy∈L»).<br>
דוגמאות: «Σ^*», «{#_a=#_b}» (שתי מילים מאוזנות נותנות יחד מילה מאוזנת), «a^*».</div>
<h3>זהויות שימושיות</h3>
<ul>
<li>«(L^*)^*=L^*», «L^*L^*=L^*», «(L^+)^*=L^*».</li>
<li>«L·(M∪N)=LM∪LN» (חוק הפילוג).</li>
<li><b>לא</b> נכון בהכרח: «(L∪M)^*=L^*∪M^*». עבור «{a},{b}», המילה ab נמצאת רק בצד שמאל.</li>
<li><b>לא</b> נכון בהכרח: «(L∩M)^*=L^*∩M^*». עבור «{a},{aa}», החיתוך הוא «∅», ולכן צד שמאל הוא «{ε}», אבל aa נמצאת בצד ימין.</li>
</ul>`},
{t:'יחסים (רפלקסיבי, סימטרי, שקילות)', h:`
<p>זה רלוונטי למשפט נרוד ולשאלה מ-2024. יחס R הוא קבוצה של זוגות «(x,y)».</p>
<ul>
<li><b>רפלקסיבי:</b> לכל x, «(x,x)∈R».</li>
<li><b>סימטרי:</b> אם «(x,y)∈R», אז גם «(y,x)∈R».</li>
<li><b>טרנזיטיבי:</b> אם «(x,y)» ו-«(y,z)» ב-R, אז גם «(x,z)».</li>
<li><b>יחס שקילות</b> = כל השלוש. יחס שקילות מחלק את הקבוצה ל<b>מחלקות</b>: קבוצות זרות שבכל אחת כל האיברים "שקולים" זה לזה.</li>
</ul>
<details class="wex"><summary><span class="wl">דוגמה</span><span class="wq">«R={(x,y) | x היא סיפא של y, או y היא רישא של x}». רפלקסיבי? סימטרי?</span></summary><div>
<p><b>רפלקסיבי:</b> כל מילה היא סיפא של עצמה, ולכן כן.</p>
<p><b>סימטרי:</b> כדי להפריך מספיק זוג אחד. ניקח «(b,ab)»: b היא סיפא של ab, ולכן «(b,ab)∈R».<br>
ההפוך «(ab,b)»: האם ab סיפא של b? לא. האם b רישא של ab? לא (הרישא באורך 1 היא a). לכן «(ab,b)∉R», ו-R לא סימטרי.</p>
<p><b>השיטה:</b> כדי להוכיח "לכל" צריך טיעון כללי. כדי להפריך מספיקה דוגמה אחת.</p></div></details>`}

sections:[

{t:'אס״ד: ההגדרה הפורמלית', h:`
<p>אס״ד (אוטומט סופי דטרמיניסטי, DFA) הוא חמישייה «A=<Q,Σ,q_0,δ,F>»:</p>
<ul>
<li>«Q»: קבוצה סופית של מצבים.</li>
<li>«Σ»: הא״ב.</li>
<li>«q_0∈Q»: מצב ההתחלה.</li>
<li>«δ: Q×Σ→Q»: פונקציית המעברים. <b>לכל מצב ולכל אות יש בדיוק מעבר אחד.</b></li>
<li>«F⊆Q»: המצבים המקבלים.</li>
</ul>
<p>«L(A)» היא קבוצת המילים שהריצה עליהן מסתיימת במצב מ-F. שפה נקראת <b>רגולרית</b> אם יש אס״ד שמקבל אותה.</p>
<h3>טבלת מעברים</h3>
<p>אותו אוטומט אפשר לכתוב כטבלה. זה נוח יותר מציור ומקובל במבחן:</p>
<div class="pre">      a    b
→*E   E    O
  O   O    E</div>
<p>הסימן «→» מסמן התחלה, והסימן «*» מסמן מצב מקבל.</p>
<h3>מצב מלכודת (בור)</h3>
<p>מצב לא מקבל שכל המעברים ממנו חוזרים אליו. נכנסים אליו כשהמילה כבר "נפסלה סופית". למשל בשפה «a^*b^*», אם קראנו a אחרי b, אין תקנה. בציורים נהוג לפעמים להשמיט את המלכודת ("חץ חסר = מלכודת"), <mark>אבל כשסופרים מצבים בודקים אם כתוב "כולל מלכודת"</mark>.</p>`},
{t:'איך מתכננים אס״ד: השיטה', h:`
<div class="callout idea"><b>השאלה המרכזית:</b> "מה אני חייב לזכור על מה שקראתי עד עכשיו, כדי להחליט על ההמשך?" כל תשובה אפשרית היא מצב.</div>
<details class="wex"><summary><span class="wl">דוגמה 1</span><span class="wq">אס״ד למילים מעל «{a,b}» שמסתיימות ב-ab</span></summary><div>
<ol>
<li><b>מה צריך לזכור?</b> רק את הסוף של מה שקראנו, וכמה ממנו מתאים להתחלה של "ab".</li>
<li>מצבים: «q_0» = אין התאמה. «q_1» = האות האחרונה היא a (התחלנו ab). «q_2» = שתי האותיות האחרונות הן ab (מקבל).</li>
<li>מעברים:
<div class="pre">       a    b
→q0    q1   q0
 q1    q1   q2
*q2    q1   q0</div></li>
<li>שימו לב: מ-«q_1» עם a נשארים ב-«q_1», כי "aa" עדיין מסתיים ב-a. מ-«q_2» עם b חוזרים ל-«q_0», כי "abb" לא מסתיים ב-a.</li>
</ol>
<p>אפשר לבדוק את זה בכלי האינטראקטיבי למטה.</p></div></details>
<details class="wex"><summary><span class="wl">דוגמה 2</span><span class="wq">מילים שמכילות את תת-המילה aa</span></summary><div>
<ol>
<li>זוכרים כמה מ-"aa" כבר מצאנו ברצף: 0, 1 או 2 (נמצא).</li>
<li>«q_0 –a→ q_1», «q_0 –b→ q_0». «q_1 –a→ q_2», «q_1 –b→ q_0». «q_2» מקבל ונשאר בו לתמיד (מצב "ניצחון").</li>
</ol>
<p>3 מצבים. ההבדל מדוגמה 1: כאן אחרי שמוצאים aa זה נשאר לתמיד, ושם רק הסוף חשוב.</p></div></details>
<details class="wex"><summary><span class="wl">דוגמה 3</span><span class="wq">«#_a(w) mod 3 = 0»</span></summary><div>
<p>זוכרים את השארית 0, 1 או 2. ‏a מקדמת: «0→1→2→0». ‏b לא משנה (לולאה). מקבל: 0. סה״כ 3 מצבים.</p></div></details>
<details class="wex"><summary><span class="wl">דוגמה 4</span><span class="wq">«{a^mb^k | (m+k) mod 3 = 0}» (שאלת מבחן 2025)</span></summary><div>
<ol>
<li>צריך לזכור: (א) האם כבר ראינו b, כי אחרי b אסור לראות a; (ב) את האורך mod 3.</li>
<li>שלב a: «A_0, A_1, A_2». שלב b: «B_0, B_1, B_2». ועוד מלכודת.</li>
<li>«A_i –a→ A_{i+1}», «A_i –b→ B_{i+1}», «B_i –b→ B_{i+1}», «B_i –a→ מלכודת».</li>
<li>מקבלים: «A_0, B_0».</li>
</ol>
<p>סה״כ <b>7</b> מצבים. אפשר לשאול אם אפשר לאחד את «A_0» עם «B_0». לא: «A_0·a» יכולה עוד להתקבל (aaa), אבל «B_0·a» כבר נפסלה.</p></div></details>
<details class="wex"><summary><span class="wl">דוגמה 5</span><span class="wq">כל רישא מקיימת «|#_a−#_b|≤1»</span></summary><div>
<p>זוכרים את ההפרש הנוכחי «#_a−#_b»: ‎−1, 0 או ‎+1. אם הוא יוצא מהטווח, עוברים למלכודת. a מוסיפה 1 ו-b מחסירה 1. כל המצבים בטווח מקבלים. סה״כ 4 מצבים.</p></div></details>`},
{t:'אסל״ד: אוטומט לא דטרמיניסטי', h:`
<p>באסל״ד (NFA) מותר:</p>
<ul><li>לצאת מאותו מצב עם אותה אות ל<b>כמה</b> מצבים, או לאף מצב.</li><li>מסעי «ε»: לעבור בין מצבים <b>בלי לקרוא אות</b>.</li></ul>
<p><b>מילה מתקבלת אם קיים לפחות מסלול אחד שמסתיים במצב מקבל.</b> אפשר לחשוב על זה כך שהאוטומט "מנחש" נכון.</p>
<details class="wex"><summary><span class="wl">דוגמה</span><span class="wq">אסל״ד למילים שהאות <b>השנייה מהסוף</b> בהן היא a</span></summary><div>
<p>«q_0» עם לולאה על a ו-b ("עוד לא הגענו"). «q_0 –a→ q_1» ("ניחשתי שזו האות השנייה מהסוף"). «q_1 –a,b→ q_2». «q_2» מקבל, ואין ממנו מעברים.</p>
<p>3 מצבים. לאס״ד מינימלי לאותה שפה צריך 4 מצבים, כי הוא חייב לזכור את שתי האותיות האחרונות. במקרה הכללי, לזהות "האות ה-k מהסוף" עולה «2^k» מצבים באס״ד.</p></div></details>
<h3>«CL_ε(q)»: סגור אפסילון</h3>
<p>כל המצבים שאפשר להגיע אליהם מ-q <b>רק במסעי «ε»</b> (אפס או יותר), כולל q עצמו.</p>
<details class="wex"><summary><span class="wl">דוגמה</span><span class="wq">«q_0 –ε→ q_1 –ε→ q_2», ו-«q_2 –a→ q_0». מה זה «CL_ε(q_0)» ו-«CL_ε(q_2)»?</span></summary><div>
<p>«CL_ε(q_0)={q_0,q_1,q_2}». «CL_ε(q_2)={q_2}», כי המעבר מ-«q_2» הוא על a ולא על «ε».</p></div></details>
<h3>אוטומט החזקה: מאסל״ד לאס״ד</h3>
<p><b>משפט:</b> לכל אסל״ד יש אס״ד שקול. לכן שני הסוגים מקבלים בדיוק את אותן שפות, השפות הרגולריות.</p>
<p><b>הבנייה:</b> כל מצב באס״ד הוא <i>קבוצה</i> של מצבי האסל״ד, "כל המקומות שהאסל״ד יכול להיות בהם עכשיו". מצב כזה מקבל אם יש בו מצב מקבל אחד לפחות. ייתכנו עד «2^n» מצבים.</p>
<details class="wex"><summary><span class="wl">דוגמה פתורה</span><span class="wq">אסל״ד ל"מסתיימת ב-ab": «q_0» (לולאה a,b), «q_0 –a→ q_1», «q_1 –b→ q_2». המירו לאס״ד.</span></summary><div>
<ol>
<li>התחלה: «{q_0}».</li>
<li>«{q_0}» עם a: «{q_0,q_1}». עם b: «{q_0}».</li>
<li>«{q_0,q_1}» עם a: «{q_0,q_1}». עם b: «{q_0,q_2}».</li>
<li>«{q_0,q_2}» עם a: «{q_0,q_1}». עם b: «{q_0}».</li>
<li>אין מצבים חדשים, ולכן עוצרים. מקבל: «{q_0,q_2}» (מכיל את «q_2»).</li>
</ol>
<p>קיבלנו 3 מצבים ישיגים, בדיוק האס״ד מדוגמה 1. רק מצבים <b>ישיגים</b> מהתחלה נכנסים (בשאלות מבחן מבקשים לפעמים לספור אותם).</p></div></details>`},
{t:'אוטומט מכפלה ומשלים', h:`
<p>כדי לבדוק שני תנאים יחד מריצים את שני האוטומטים <b>במקביל</b>. מצב באוטומט המכפלה הוא זוג «(p,q)», ש-p מצב ב-«A_1» ו-q מצב ב-«A_2». מעבר: «δ((p,q),σ)=(δ_1(p,σ),δ_2(q,σ))».</p>
<p>רק קבוצת המצבים המקבלים משתנה לפי הפעולה. <mark>זו שאלה שחוזרת:</mark></p>
<div class="tscroll"><table>
<tr><th>שפה</th><th>מצבים מקבלים</th><th>במילים</th></tr>
<tr><td>«L_1∩L_2»</td><td>«F_1×F_2»</td><td>שניהם מקבלים</td></tr>
<tr><td>«L_1∪L_2»</td><td>«(F_1×Q_2)∪(Q_1×F_2)»</td><td>לפחות אחד מקבל</td></tr>
<tr><td>«L_1−L_2»</td><td>«F_1×(Q_2−F_2)»</td><td>הראשון מקבל והשני לא</td></tr>
<tr><td>«L_1ΔL_2»</td><td>«(F_1×!{F_2})∪(!{F_1}×F_2)»</td><td>בדיוק אחד מקבל</td></tr>
</table></div>
<details class="wex"><summary><span class="wl">דוגמה</span><span class="wq">אס״ד ל"מספר זוגי של a-ים <b>וגם</b> מסתיימת ב-b"</span></summary><div>
<p>«A_1»: זוגיות של a (מצבים E, O). «A_2»: האות האחרונה b? (מצבים N, Y). המכפלה: «(E,N),(E,Y),(O,N),(O,Y)». ‏a: מחליפה E↔O ועוברת ל-N. ‏b: שומרת על הזוגיות ועוברת ל-Y. מקבל: «(E,Y)». סה״כ 4 מצבים.</p></div></details>
<h3>משלים</h3>
<p>ב<b>אס״ד שלם</b> (מכל מצב יש מעבר לכל אות) מחליפים מקבלים ולא מקבלים, ומקבלים בדיוק את «!{L}». <b>אם חסרים מעברים, קודם מוסיפים מלכודת.</b></p>
<div class="callout warn"><b>באסל״ד זה לא עובד.</b> החלפת מקבלים נותנת רק «L(B)⊇!{L(A)}».<br>
<b>דוגמה:</b> אסל״ד A ל"מכילה a": «q_0» עם לולאה a,b, «q_0 –a→ q_1», ו-«q_1» מקבל עם לולאה a,b. אחרי ההחלפה «q_0» מקבל, ולכן B מקבל <b>כל</b> מילה (נשארים ב-«q_0»). למשל a ב-«L(A)» וגם ב-«L(B)».<br>
<b>הסיבה:</b> מילה שנדחתה ב-A, כל המסלולים שלה נכשלו, ולכן ב-B כולם מצליחים. אבל מילה שהתקבלה ב-A יכולה שיהיה לה גם מסלול שנכשל, ומסלול כזה מצליח ב-B.</div>
<p>מאותה סיבה, אוטומט מכפלה של אסל״דים עם «F_1×F_2» <b>כן</b> נותן חיתוך, אבל «F_1×!{F_2}» <b>לא</b> נותן הפרש.</p>`},
{t:'בניות נוספות ושפות סופיות', h:`
<h3>הוספת «a^*» בהתחלה («{a}^*·L»)</h3>
<p>נכון: מוסיפים מצב התחלה <b>חדש</b> עם לולאת a, ומסע «ε» ממנו למצב ההתחלה הישן.</p>
<p>לא נכון: לולאת a על מצב ההתחלה הישן. אם חוזרים אליו באמצע המילה, ה-a-ים ייכנסו באמצע ולא רק בהתחלה.</p>
<h3>איחוד, שרשור, כוכב (באסל״ד)</h3>
<ul>
<li><b>איחוד:</b> מצב התחלה חדש עם «ε» לשני מצבי ההתחלה.</li>
<li><b>שרשור:</b> «ε» מכל מקבל של «A_1» להתחלה של «A_2». רק המקבלים של «A_2» נשארים מקבלים.</li>
<li><b>כוכב:</b> התחלה חדשה ומקבלת, עם «ε» להתחלה הישנה, ומכל מקבל «ε» חזרה להתחלה הישנה.</li>
<li><b>היפוך:</b> הופכים את כל החצים, המקבלים הופכים להתחלה (דרך מצב חדש עם «ε»), וההתחלה הופכת למקבל.</li>
</ul>
<details class="wex"><summary><span class="wl">מטלה 2017</span><span class="wq">מאס״ד A בנו אס״ד ל-«(L(A)∪{b})−{ε}» בלי מכפלה</span></summary><div>
<p>מצב התחלה חדש «q_{00}», לא מקבל, כדי לפסול את «ε». ממנו: על כל אות σ≠b הולכים ל-«δ(q_0,σ)». על b הולכים למצב חדש «q_b», שהוא מקבל ובכל השאר מתנהג כמו «δ(q_0,b)»: «δ(q_b,σ)=δ(δ(q_0,b),σ)».</p></div></details>
<h3>שפות סופיות ומספר המצבים</h3>
<div class="callout"><b>עובדה:</b> אם אס״ד בעל n מצבים מקבל מילה באורך n או יותר, השפה <b>אינסופית</b>.<br>
<b>למה?</b> מילה באורך n עוברת דרך «n+1» מצבים, ולכן יש מצב שחוזר (שובך היונים). החלק שבין שתי ההופעות הוא מעגל, ואפשר לחזור עליו כמה פעמים שרוצים.</div>
<p>מסקנות שנשאלו:</p>
<ul>
<li>בשפה סופית <b>המילה הארוכה ביותר קצרה ממספר המצבים</b> («n>l»).</li>
<li>שפה סופית עם מילה באורך 13 צריכה לפחות 14 מצבים (בלי מלכודת).</li>
<li>אס״ד עם 5 מצבים שמקבל מילה באורך 6 מקבל שפה אינסופית, וגם יש בה מילה באורך קטן מ-5 (מקצרים את המעגל).</li>
</ul>`}

sections:[
{t:'האינטואיציה: "העתיד מתייחס אליהן אותו דבר"', h:`
<p class="callout"><b>הנושא שהופיע הכי הרבה פעמים.</b> כמעט בכל מבחן יש שאלת "כמה מצבים יש באס״ד המינימלי", ובחצי מהמבחנים יש שאלה פתוחה של "הוכיחו בנרוד".</p>
<p>נניח שקראנו את המילה x, וחבר קרא את המילה y. אם <b>לכל המשך z</b> שנקרא מעכשיו התשובה תהיה זהה (שנינו נקבל או שנינו נדחה), אין סיבה לזכור במה x שונה מ-y. האוטומט יכול להיות באותו מצב אחרי שתיהן.</p>
<p>אם יש <b>המשך אחד</b> z שבו «xz∈L» אבל «yz∉L», האוטומט <b>חייב</b> להבדיל ביניהן, כלומר להיות במצבים שונים. z כזו נקראת <b>מילה מפרידה</b>.</p>
<h3>ההגדרה</h3>
<div class="box">«x R_L y» ⟺ לכל «z∈Σ^*»: «xz∈L ⟺ yz∈L».</div>

{t:'משפט מייהיל–נרוד', h:`
<div class="callout idea"><b>המשפט:</b>

<p><b>למה זה נכון (בקצרה):</b> שתי מילים שמובילות לאותו מצב באס״ד הן בהכרח שקולות, כי מאותו מצב ההמשך זהה. לכן מספר המחלקות קטן או שווה למספר המצבים בכל אס״ד. בכיוון השני, אפשר לבנות אס״ד שהמצבים שלו הם המחלקות עצמן.</p>

{t:'חישוב מחלקות: דוגמאות פתורות', h:`
<p><b>השיטה:</b> עוברים על מילים קצרות לפי הסדר («ε, a, b, aa, ab, …»). לכל מילה שואלים: "האם היא שקולה למילה שכבר ראיתי?" אם לא, נפתחת מחלקה חדשה. עוצרים כשכל ההמשכים של המחלקות כבר חוזרים למחלקות קיימות.</p>

</table></div>
<div class="callout warn"><b>מלכודות בספירה:</b>
<ul><li>האם השאלה אומרת "כולל מלכודת"?</li>
<li>א״ב גדול יותר (למשל c שלא מופיע בתנאי) בדרך כלל לא משנה, כי c פשוט עושה לולאה.</li>
<li>תמיד מנסים לאחד מצבים: האם שני מצבים מתנהגים אותו דבר בכל המשך?</li></ul></div>`},
{t:'הוכחת אי-רגולריות עם נרוד', h:`
<p>לפי המשפט, כדי להראות ש-L <b>אינה</b> רגולרית מספיק להראות <b>אינסוף מילים שכל שתיים מהן במחלקות שונות</b>.</p>
<div class="box"><h3>התבנית (מעתיקים למבחן)</h3>
<ol>
<li>נתבונן בקבוצה האינסופית «{w_i | i≥0}», כאשר «w_i=a^i».</li>
<li>יהיו «i≠j». נבחר «z=…».</li>
<li>אז «w_iz=…∈L», ואילו «w_jz=…∉L» כי …</li>
<li>לכן «w_i» ו-«w_j» במחלקות שונות של «R_L», ולכן ל-«R_L» אינסוף מחלקות. לפי משפט מייהיל–נרוד, L אינה רגולרית. ∎</li>
</ol></div>
<h3>איך מוצאים את z?</h3>
<p>שואלים: "אחרי «a^i», מה צריך להוסיף כדי להיכנס לשפה בדיוק?" ה-z הזה כמעט תמיד "מתאים" ל-i ולא ל-j.</p>
<details class="wex"><summary><span class="wl">מבחן 2018</span><span class="wq">«{w∈{a,b,c}^* | #_a=#_b·#_c}»</span></summary><div>
<p>«w_i=a^i». אחרי «a^i» צריך «#_b·#_c=i». הדרך הפשוטה ביותר: «z=b^ic» (כלומר «i·1=i»).</p>
<p>«a^ib^ic»: ‏«#_a=i=i·1» ✓. ‏«a^jb^ic»: ‏«j≠i·1» ✗. סיימנו.</p></div></details>
<details class="wex"><summary><span class="wl">מבחן 2022</span><span class="wq">«{ww | w∈{a,b}^*}»</span></summary><div>
<p>«w_i=a^i». ‏«z=ba^ib»: ‏«a^iba^ib=(a^ib)(a^ib)» ✓.</p>
<p>«a^jba^ib»: אם זו הייתה «uu», אז בכל חצי יש b אחת, והחצי הראשון הוא «a^jb», והשני «a^ib». מאחר ש-«i≠j» זו לא מילה מהצורה uu ✗.</p></div></details>
<details class="wex"><summary><span class="wl">מבחן 2023</span><span class="wq">«{a^{1+2+…+k} | k≥1}» (מספרים משולשים)</span></summary><div>
<p>כאן כדאי לבחור «w_i=a^{T_i}», כאשר «T_i=1+…+i». עבור «i<j» נבחר «z=a^{i+1}».</p>
<p>«w_iz=a^{T_i+i+1}=a^{T_{i+1}}∈L» ✓.</p>
<p>«w_jz=a^{T_j+i+1}». מאחר ש-«1≤i+1<j+1», מתקיים «T_j<T_j+i+1<T_j+j+1=T_{j+1}». זה ממש בין שני מספרים משולשים עוקבים, ולכן ✗.</p></div></details>
<details class="wex"><summary><span class="wl">מבחן 2024</span><span class="wq">כל המחלקות של «{a^{n²}}» עם מילים מפרידות</span></summary><div>
<p>כל «a^i» נמצאת במחלקה <b>נפרדת</b>. עבור «k<i» נבחר «z=a^{i²+i+1}»:</p>
<p>«a^iz=a^{i²+2i+1}=a^{(i+1)²}∈L» ✓. ‏«a^kz=a^{i²+i+k+1}». מאחר ש-«0≤k<i», מתקיים «i²<i²+i+k+1<(i+1)²» ✗.</p></div></details>
<details class="wex"><summary><span class="wl">מבחן 2026</span><span class="wq">«{a^mb^kc^t | k=m·t}»</span></summary><div>
<p>«w_i=a^i», «z=b^ic». ‏«a^ib^ic»: ‏«i=i·1» ✓. ‏«a^jb^ic»: ‏«i≠j·1» ✗.</p></div></details>
<details class="wex"><summary><span class="wl">דוגמה</span><span class="wq">«{a^mb^k | m≠k}»</span></summary><div>
<p>«w_i=a^i», «z=b^i». ‏«a^ib^i∉L», אבל «a^jb^i∈L» (כי «j≠i»). שימו לב: כאן ה-z מכניס את «w_j» לשפה ולא את «w_i», וזה תקין. צריך רק שאחת תיכנס והשנייה לא.</p></div></details>`}
]},

{id:'regex', name:'ביטויים רגולריים ומשפט קלין', short:'קריאה וכתיבה של ביטויים, «+ · *»', tool:'regex',
sections:[
{t:'מה זה ביטוי רגולרי', h:`
<p>ביטוי רגולרי הוא דרך <b>לכתוב</b> שפה בנוסחה קצרה. הוא בנוי משלוש פעולות:</p>
<div class="tscroll"><table>
<tr><th>סימון</th><th>משמעות</th><th>דוגמה</th><th>השפה</th></tr>
<tr><td>«r+s»</td><td>איחוד ("או")</td><td>«a+b»</td><td>«{a,b}»</td></tr>
<tr><td>«rs»</td><td>שרשור</td><td>«ab»</td><td>«{ab}»</td></tr>
<tr><td>«r^*»</td><td>0 חזרות או יותר</td><td>«a^*»</td><td>«{ε,a,aa,…}»</td></tr>
<tr><td>«r^+»</td><td>חזרה אחת או יותר («=rr^*»)</td><td>«a^+»</td><td>«{a,aa,…}»</td></tr>
<tr><td>«ε», «∅»</td><td>המילה הריקה, השפה הריקה</td><td></td><td></td></tr>
</table></div>
<p><b>סדר קדימויות:</b> «*» קודם, אחר כך שרשור, ואחרון «+». לכן «ab^*» הוא a ואחריה b-ים (abbb), ולא «(ab)^*» (ababab). ו-«a+bc» הוא «a» או «bc».</p>
<div class="callout warn">אצלנו <b>«+» הוא "או"</b>, ולא "אחת או יותר". כשמופיע «^+» כחזקה עילית, זה "אחת או יותר".</div>`},
{t:'קריאת ביטויים: הרבה דוגמאות', h:`
<p>לכל ביטוי: נסו להגיד בעברית איזו שפה הוא מקבל, ורק אחר כך פתחו.</p>
<details class="wex"><summary><span class="wl">1</span><span class="wq">«(a+b)^*»</span></summary><div><p>כל המילים, «Σ^*».</p></div></details>
<details class="wex"><summary><span class="wl">2</span><span class="wq">«(a+b)^*a(a+b)^*»</span></summary><div><p>מכילה לפחות a אחת. "משהו, a, משהו".</p></div></details>
<details class="wex"><summary><span class="wl">3</span><span class="wq">«b^*ab^*ab^*»</span></summary><div><p>בדיוק שתי a-ים.</p></div></details>
<details class="wex"><summary><span class="wl">4</span><span class="wq">«((a+b)(a+b))^*»</span></summary><div><p>אורך זוגי. כל סיבוב מוסיף שתי אותיות.</p></div></details>
<details class="wex"><summary><span class="wl">5</span><span class="wq">«(a+b)^*b(a+b)»</span></summary><div><p>האות השנייה מהסוף היא b.</p></div></details>
<details class="wex"><summary><span class="wl">6</span><span class="wq">«(a+ba)^*(ε+b)»</span></summary><div><p>אין שתי b-ים ברצף. כל b (חוץ מאולי האחרונה) באה מיד עם a אחריה.</p></div></details>
<details class="wex"><summary><span class="wl">7</span><span class="wq">«(a+ba^*b)^*» ו-«(a+ba^*b)^*ba^*» (מבחנים 2020, 2024)</span></summary><div>
<p>«ba^*b» הוא בלוק עם בדיוק שתי b-ים. לכן «(a+ba^*b)^*» = מילים עם מספר <b>זוגי</b> של b-ים.</p>
<p>מוסיפים «ba^*», כלומר עוד b אחת, ומקבלים מספר <b>אי-זוגי</b> של b-ים.</p></div></details>
<details class="wex"><summary><span class="wl">8</span><span class="wq">«(0+10)^*1^*» (2022)</span></summary><div>
<p>«(0+10)^*»: כל 1 באה מיד עם 0 אחריה, כלומר אין שתי 1-ים ברצף ולא מסתיימים ב-1. אחר כך «1^*» מאפשר זנב של 1-ים בסוף.</p>
<p>אם כך, מתי מופיע "11"? רק בזנב, ואחרי הזנב אין 0. לכן השפה היא <b>מילים בלי 110</b>.</p></div></details>
<details class="wex"><summary><span class="wl">9</span><span class="wq">«(0+10+110)^*(ε+1+11)» (2020)</span></summary><div><p>בלוקים שמסתיימים ב-0 עם לכל היותר שתי 1-ים לפניו, ובסוף עד שתי 1-ים. כלומר <b>אין 111</b>.</p></div></details>
<details class="wex"><summary><span class="wl">10</span><span class="wq">«(b+a^+bb)^*(a^*+a^+b)» (2026)</span></summary><div><p>אחרי בלוק של a-ים שאחריו באה b, חייבות לבוא לפחות שתי b-ים (אלא אם זה סוף המילה). כלומר <b>אין aba</b>.</p></div></details>
<details class="wex"><summary><span class="wl">11</span><span class="wq">«(01+10)^*(ε+0+1)» (2017)</span></summary><div><p>זוגות של 01 או 10, ואולי אות בודדת בסוף. בכל רישא ההפרש «|#_0−#_1|» לכל היותר 1.</p></div></details>
<details class="wex"><summary><span class="wl">12</span><span class="wq">«r_1=a^++b^*(a^*b)^*» מול «r_2=a^*+b(a^*b)^*» (2022)</span></summary><div>
<p>«b^*(a^*b)^*»: «ε» או מילים שמסתיימות ב-b (כל בלוק נגמר ב-b). לכן «r_1» = a-ים בלבד (לפחות אחת), או «ε», או מילים שמסתיימות ב-b.</p>
<p>«b(a^*b)^*»: מתחילות ב-b <b>וגם</b> מסתיימות ב-b. לכן «r_2» = a-ים בלבד (כולל «ε»), או מילים שמתחילות ונגמרות ב-b.</p>
<p>מסקנה: «L(r_2)⊊L(r_1)». למשל ab ב-«r_1» בלבד.</p></div></details>`},
{t:'כתיבת ביטויים: השיטה', h:`
<ol>
<li><b>מפרקים למקרים</b> ומחברים אותם עם «+».</li>
<li><b>חושבים בבלוקים:</b> מה החתיכה שחוזרת? זה הדבר שנכנס בתוך «^*».</li>
<li><b>מטפלים בקצוות:</b> מה מותר בהתחלה, מה מותר בסוף, האם «ε» בשפה.</li>
<li><b>בודקים</b> מילים קצרות: גם כאלה שאמורות להתקבל וגם כאלה שלא. (בשביל זה יש את הכלי למטה.)</li>
</ol>
<details class="wex"><summary><span class="wl">דוגמה</span><span class="wq">מילים שמתחילות ב-00 ולא מכילות 000 (2017)</span></summary><div>
<ol><li>מתחילים ב-00. אחרי 00 האות הבאה (אם יש) חייבת להיות 1.</li>
<li>אחר כך בלוקים שכל אחד מתחיל ב-1 ואחריו לכל היותר שתי 0-ים: «1», «10», «100».</li></ol>
<p>התשובה: «00(1+10+100)^*».</p></div></details>
<details class="wex"><summary><span class="wl">מבחן 2024</span><span class="wq">מסתיימות ב-b ולא מכילות bab</span></summary><div>
<ol><li>bab אסור, כלומר בין שתי b-ים לא יכולה להיות a <b>בודדת</b>. אחרי בלוק b-ים (שאינו בסוף) צריך לפחות aa.</li>
<li>בלוקים: «a» (a-ים חופשיים), או «b^+aa» (b-ים ואחריהן לפחות שתי a-ים).</li>
<li>בסוף: «b^+».</li></ol>
<p>התשובה: «(a+b^+aa)^*b^+».</p></div></details>
<details class="wex"><summary><span class="wl">מבחן 2025</span><span class="wq">לא מסתיימות בשתי אותיות זהות</span></summary><div>
<p>מקרים: מילים באורך 0 או 1 («ε+a+b»), או מילים שמסתיימות ב-ab או ב-ba.</p>
<p>התשובה: «ε+a+b+(a+b)^*(ab+ba)».</p></div></details>
<details class="wex"><summary><span class="wl">מבחן 2025</span><span class="wq">בדיוק שתי b-ים, <b>או</b> לפחות שתי a-ים</span></summary><div>
<p>איחוד של שני ביטויים: «a^*ba^*ba^* + (a+b)^*a(a+b)^*a(a+b)^*».</p></div></details>
<details class="wex"><summary><span class="wl">דוגמה</span><span class="wq">משלים של "מכילה 111"</span></summary><div>
<p>משלים ישירות קשה לכתוב. חושבים על השפה המשלימה במילים: "<b>אין</b> 111". בונים בלוקים שמסתיימים ב-0 עם עד שתי 1-ים לפניו: «(0+10+110)^*», ומאפשרים זנב של עד שתי 1-ים: «(ε+1+11)».</p></div></details>
<h3>זהויות שימושיות</h3>
<ul>
<li>«(a+b)^*=(a^*b^*)^*=(a^*+b^*)^*»</li>
<li>«(ε+a)^*=a^*», «a^*a^*=a^*», «(a^*)^*=a^*»</li>
<li>«r+∅=r», «r∅=∅», «∅^*=ε», «rε=r»</li>
<li>«a(ba)^*=(ab)^*a»</li>
</ul>`},
{t:'משפט קלין', h:`
<div class="callout idea"><b>משפט קלין:</b> שפה L רגולרית (כלומר יש לה אוטומט סופי) ⟺ קיים ביטוי רגולרי שמקבל אותה.</div>
<p>כלומר שלושת המודלים שקולים: <b>אס״ד ≡ אסל״ד ≡ ביטוי רגולרי</b>.</p>
<h3>שני הכיוונים של ההוכחה (ברמת רעיון)</h3>
<ul>
<li><b>ביטוי ⟵ אוטומט:</b> בונים אסל״ד באינדוקציה על מבנה הביטוי: לאות, לאיחוד (התחלה חדשה עם «ε»), לשרשור, ולכוכב (כמו בנושא 2).</li>
<li><b>אוטומט ⟵ ביטוי:</b> מגדירים את «r_{ij}^k» = <b>המילים שמובילות מ-«q_i» ל-«q_j» כשכל מצבי הביניים הם מבין «q_1…q_k»</b>, ובונים בהדרגה:<br>
«r_{ij}^k=r_{ij}^{k−1}+r_{ik}^{k−1}(r_{kk}^{k−1})^*r_{kj}^{k−1}»<br>
(או שלא עוברים דרך «q_k», או שהולכים ל-«q_k», מסתובבים בו, וממשיכים ל-«q_j».)</li>
</ul>
<h3>מה שואלים</h3>
<ul>
<li>"מה קובע משפט קלין?" בוחרים את התשובה עם <mark>ביטוי רגולרי</mark>. אס״ד↔אסל״ד היא בניית החזקה, ומחלקות שקילות הן נרוד. (הופיע ב-5 מבחנים.)</li>
<li>"כל שפה רגולרית מתקבלת מהשפות האלמנטריות ע״י…" התשובה: <b>איחוד, שרשור וסגור *</b>.</li>
<li>"«r_{ij}^k» מקבל מסלולים ש…" התשובה: <b>עשויים לעבור במצבי הביניים «q_1…q_k»</b>.</li>
</ul>`},
{t:'שאלות "איזו מילה לא מתקבלת"', h:`
<p>השיטה הבטוחה:</p>
<ol><li>מתרגמים את הביטוי למשפט בעברית (בעזרת הספרייה למעלה).</li>
<li>מחפשים בתשובות את המילה שמפרה את הכלל.</li>
<li>אם לא מצליחים לתרגם, מנסים לפרק כל מילה לבלוקים של הביטוי משמאל לימין. אם נתקעים, המילה לא מתקבלת.</li></ol>
<details class="wex"><summary><span class="wl">מבחן 2018</span><span class="wq">איזו מילה לא מתקבלת ע״י «(0(0(01)^*1)^*1)^*»: 011001, 010011, 001011, 000111?</span></summary><div>
<p>כל בלוק חיצוני הוא «0 X^* 1», כאשר «X=0(01)^*1». ננסה לפרק:</p>
<ul>
<li>010011 = 01 | 0(01)1, כלומר «0·X·1» עם «X=01» ✓.</li>
<li>001011 = 0 · 01 · 01 · 1 ✓.</li>
<li>000111 = 0 · 0(01)1 · 1 ✓.</li>
<li>011001 = 01 | 1001: בלוק חייב להתחיל ב-0, ו-1001 מתחיל ב-1 ✗.</li>
</ul></div></details>
<div class="callout warn">שימו לב: «{w | |#_0(w)−#_1(w)|≤2}» (על <b>כל המילה</b>) <b>אינה רגולרית</b>, ואין לה ביטוי רגולרי. אבל "בכל <b>רישא</b> «|…|≤2»" כן רגולרית. ההבדל בין המילה כולה לכל רישא משמעותי.</div>`}
]},

{id:'pump', name:'למת הניפוח (רגולריות)', short:'הוכחה ששפה אינה רגולרית, בחירת z', tool:'pump',
sections:[
{t:'האינטואיציה', h:`
<p>לאס״ד יש n מצבים. כשקוראים מילה באורך n לפחות, עוברים דרך «n+1» מצבים, ולכן <b>מצב כלשהו חוזר</b>. בין שתי ההופעות שלו קראנו חתיכה v שמחזירה אותנו לאותו מצב, כלומר <b>מעגל</b>.</p>
<p>את המעגל אפשר לעבור 0 פעמים, פעמיים, או 17 פעמים, והאוטומט לא ירגיש בהבדל. לכן גם המילים «uw», «uvvw», «uvvvw»… מתקבלות.</p>
<p>המסקנה: <b>בשפה רגולרית, כל מילה ארוכה מכילה ליד ההתחלה חתיכה שאפשר "לנפח".</b> אם מוצאים מילה ארוכה שבה <i>כל</i> ניפוח יוצא מהשפה, השפה לא רגולרית.</p>`},
{t:'הלמה', h:`
<div class="box">אם L רגולרית, אז <b>קיים</b> n (קבוע הלמה) כך ש<b>לכל</b> «z∈L» עם «|z|≥n» <b>קיים</b> פירוק «z=uvw» המקיים:
<ol><li>«|uv|≤n»: המעגל נמצא ב-n האותיות הראשונות.</li><li>«|v|≥1»: המעגל לא ריק.</li><li><b>לכל</b> «i≥0»: «uv^iw∈L».</li></ol></div>
<h3>ההוכחה כמשחק בין שני שחקנים</h3>
<div class="tscroll"><table>
<tr><th>שלב</th><th>מי בוחר</th><th>מה</th></tr>
<tr><td>1</td><td>היריב</td><td>את n (לא יודעים מה הוא, ולכן עובדים עם n כללי)</td></tr>
<tr><td>2</td><td><b>אתם</b></td><td>מילה «z∈L» עם «|z|≥n». המילה תלויה ב-n</td></tr>
<tr><td>3</td><td>היריב</td><td>את הפירוק «uvw». צריך לטפל ב<b>כל</b> פירוק אפשרי</td></tr>
<tr><td>4</td><td><b>אתם</b></td><td>את i, כך ש-«uv^iw∉L»</td></tr>
</table></div>
<p>אם תמיד אפשר לנצח, השפה לא רגולרית.</p>
<div class="callout warn"><b>הלמה עובדת רק בכיוון אחד:</b> היא מוכיחה ששפה <b>אינה</b> רגולרית. שפה שמקיימת את הלמה <b>לא בהכרח</b> רגולרית. שפה סופית מקיימת את הלמה באופן ריק (בוחרים n גדול מהמילה הארוכה ביותר, ואז אין מילים שצריך לבדוק).</div>`},
{t:'הוכחות פתורות', h:`
<div class="box"><h3>התבנית (מעתיקים למבחן)</h3>
נניח בשלילה ש-L רגולרית, ויהי n קבוע הלמה. נבחר «z=…». מתקיים «z∈L» ו-«|z|≥n».<br>
לפי הלמה קיים פירוק «z=uvw» עם «|uv|≤n», «|v|≥1», ולכל «i≥0» «uv^iw∈L».<br>
מאחר ש-«|uv|≤n», v מורכבת רק מ-… . נסמן «v=…^t», «1≤t≤n».<br>
נבחר «i=…», ונקבל «uv^iw=…∉L», בסתירה. לכן L אינה רגולרית. ∎</div>
<details class="wex"><summary><span class="wl">קלאסי</span><span class="wq">«{a^nb^n | n≥0}»</span></summary><div>
<ol><li>«z=a^nb^n». ה-n הראשונים הם רק a, ולכן «v=a^t» עם «t≥1».</li>
<li>«i=2»: «a^{n+t}b^n». מאחר ש-«n+t≠n», המילה לא בשפה. סתירה.</li></ol>
<p>(גם «i=0» עובד: «a^{n−t}b^n».)</p></div></details>
<details class="wex"><summary><span class="wl">מבחן 2020</span><span class="wq">«{ww^Rw | w∈{0,1,2}^*}»</span></summary><div>
<ol><li>בוחרים «w=0^n1», ולכן «z=0^n1·10^n·0^n1=0^n110^{2n}1».</li>
<li>«|uv|≤n», ולכן «v=0^t».</li>
<li>«i=2»: «0^{n+t}110^{2n}1». במילה מהשפה «ww^Rw» הבלוק הראשון של 0-ים הוא חצי מהבלוק האמצעי. כאן «2(n+t)≠2n», ולכן המילה לא בשפה.</li></ol>
<p><b>טיפ:</b> בחרנו w עם 1, כדי שיהיו "סמנים" שמפרידים בין החלקים. «z=0^{3n}» לא הייתה עובדת, כי «0^k» בשפה כשה-k מתחלק ב-3, ואז קשה להגיע לסתירה.</p></div></details>
<details class="wex"><summary><span class="wl">הטריק «n!»</span><span class="wq">«{a^mb^k | m≠k}»: למה «z=a^nb^{n+1}» לא מספיקה?</span></summary><div>
<p>עם «z=a^nb^{n+1}» ו-«v=a^t», צריך i כך ש-«n+(i−1)t=n+1», כלומר «(i−1)t=1». זה עובד רק אם «t=1». אם היריב בחר «t=2», אי אפשר.</p>
<p><b>הפתרון:</b> «z=a^nb^{n+n!}». לכל «1≤t≤n», ‏t מחלק את «n!», ולכן «i=n!/t+1» מספר שלם, ומקבלים «a^{n+n!}b^{n+n!}∉L». ‏«n!» מתחלק בכל מספר עד n, ולכן מתאים לכל t שהיריב בוחר.</p></div></details>
<details class="wex"><summary><span class="wl">מבחן 2022</span><span class="wq">«{w∈{a,b}^* | #_a≠2#_b}»</span></summary><div>
<ol><li>«z=b^na^{2n+2n!}». יש «#_a=2n+2n!≠2n=2#_b», ולכן «z∈L».</li>
<li>«v=b^t». נבחר «i=n!/t+1», ומספר ה-b-ים יהיה «n+n!».</li>
<li>אז «2#_b=2n+2n!=#_a», ולכן המילה <b>לא</b> בשפה. סתירה.</li></ol></div></details>
<details class="wex"><summary><span class="wl">ריבועים</span><span class="wq">«{a^{k²}}»</span></summary><div>
<ol><li>«z=a^{n²}», «v=a^t», «1≤t≤n».</li>
<li>«i=2»: האורך «n²+t». מתקיים «n²<n²+t≤n²+n<n²+2n+1=(n+1)²».</li>
<li>האורך נופל בין שני ריבועים עוקבים, ולכן הוא לא ריבוע. סתירה.</li></ol>
<p>אותו דבר עם חזקות שלישיות («{a^{k³}}») ו-«i=3» או «i=5»: ‏«n³+4n<(n+1)³», ולכן גם כאן האורך לא חזקה שלישית.</p></div></details>
<details class="wex"><summary><span class="wl">ראשוניים</span><span class="wq">«{a^p | p ראשוני}»</span></summary><div>
<ol><li>בוחרים «z=a^p» עם p ראשוני, «p≥n+2». «v=a^t».</li>
<li>«i=p+1»: האורך «p+pt=p(1+t)». זו מכפלה של שני מספרים גדולים מ-1, ולכן לא ראשוני. סתירה.</li></ol></div></details>
<details class="wex"><summary><span class="wl">מטלה 2017</span><span class="wq">«{ba^kba^t | k≠t}»: שני מקרים</span></summary><div>
<p>«z=ba^nba^{n+n!}». כאן v יכולה להכיל את ה-b הראשונה, ולכן יש שני מקרים:</p>
<ul><li>«v=a^t» (בלי ה-b): ‏«i=n!/t+1» נותן «ba^{n+n!}ba^{n+n!}∉L».</li>
<li>v מכילה את ה-b הראשונה: ‏«i=0» מוחק אותה, והמילה לא מתחילה ב-b, ולכן ∉L.</li></ul>
<p><b>חובה לטפל בכל המקרים של v.</b></p></div></details>`},
{t:'איך בוחרים z טובה (ואיך לא)', h:`
<ul>
<li><b>z חייבת להיות בשפה.</b> בלי זה ההוכחה לא תקפה.</li>
<li><b>שמים את החלק ה"רגיש" ב-n האותיות הראשונות.</b> מאחר ש-«|uv|≤n», v חייבת להיות שם, ואתם יודעים בדיוק ממה היא מורכבת.</li>
<li><b>z צריכה להיות "על הקצה":</b> כך שכל שינוי קטן יוציא אותה מהשפה.</li>
</ul>
<h3>בחירות גרועות שנשאלו כשאלות אמריקאיות</h3>
<details class="wex"><summary><span class="wl">2017</span><span class="wq">למה «z=(ab)^n» לא טובה עבור «#_a=#_b»?</span></summary><div><p>היריב בוחר «v=ab», ואז כל ניפוח שומר על האיזון. אין סתירה. הבחירה הטובה: «z=a^nb^n», ואז v היא רק a-ים.</p></div></details>
<details class="wex"><summary><span class="wl">2025</span><span class="wq">למה «z=ba^nb» לא טובה עבור פלינדרומים?</span></summary><div><p>היריב בוחר «u=b», ו-v מתוך ה-a-ים. אז «ba^mb» היא פלינדרום לכל m. בחירה טובה: «a^nba^n», ואז v היא a-ים מהצד השמאלי בלבד, והסימטריה נשברת.</p></div></details>
<h3>טעויות נפוצות</h3>
<ul>
<li>לבחור את הפירוק בעצמכם. הפירוק נבחר ע״י היריב, ולכן צריך לטפל בכולם.</li>
<li>לבחור n מספרי (למשל «n=5»). n הוא כללי.</li>
<li>לשכוח את «|uv|≤n». זה הכלי הכי חשוב להגביל את v.</li>
<li>להסיק "השפה מקיימת את הלמה, ולכן רגולרית". זה לא נכון.</li>
</ul>
<div class="callout idea"><b>דרך עוקפת שימושית: סגירות.</b> כדי להראות ש-«{#_a=#_b}» לא רגולרית: אם היא הייתה רגולרית, גם «L∩a^*b^*={a^nb^n}» הייתה רגולרית (חיתוך עם רגולרית). אבל ראינו שהיא לא.</div>`}

{id:'cfg', name:'דקדוקים חופשיי הקשר', short:'כתיבת דקדוק וזיהוי השפה שלו', tool:'cfg',
sections:[
{t:'מה זה דקדוק: הגדרה רקורסיבית', h:`
<p>דקדוק הוא אוסף של <b>כללי החלפה</b>. מתחילים מהמשתנה S, ובכל צעד מחליפים משתנה (אות גדולה) לפי אחד הכללים, עד שנשארות רק אותיות קטנות (טרמינלים).</p>
<details class="wex" open><summary><span class="wl">דוגמה</span><span class="wq">גזירה של aaabbb בדקדוק «S→aSb | ε»</span></summary><div>
<div class="pre">S ⇒ aSb ⇒ aaSbb ⇒ aaaSbbb ⇒ aaabbb</div>
<p>בכל צעד ה-S "עוטף" את עצמו ב-a משמאל וב-b מימין. לכן תמיד יש בדיוק אותו מספר a-ים ו-b-ים, וכל ה-a-ים לפני כל ה-b-ים. השפה: «{a^nb^n | n≥0}».</p></div></details>
<p><b>הגדרה:</b> «G=(V,T,S,P)»: משתנים, טרמינלים, משתנה התחלה, וכללים. דקדוק <b>חופשי הקשר</b> (ח״ה): בצד שמאל של כל כלל יש <b>משתנה בודד</b>. כלומר אפשר להחליף משתנה בלי להתחשב במה שמסביבו.</p>
<p>שפה היא <b>ח״ה</b> אם יש לה דקדוק ח״ה. כל שפה רגולרית היא ח״ה, אבל לא להפך («a^nb^n» ח״ה ולא רגולרית).</p>
<h3>הכוח של דקדוק: התאמה מקוננת</h3>
<p>האוטומט לא יכול "לספור", אבל הדקדוק יכול <b>לעטוף</b>: כל אות שנוספת משמאל מותאמת לאות שנוספת מימין. בזכות זה דקדוק יכול לטפל ב-«a^nb^n», בפלינדרומים ובסוגריים מאוזנים.</p>`},
{t:'תבניות בסיס: דוגמאות פתורות', h:`
<details class="wex"><summary><span class="wl">1</span><span class="wq">«{a^nb^{2n}}»</span></summary><div><p>«S→aSbb | ε». כל a מתאימה לשתי b-ים.</p></div></details>
<details class="wex"><summary><span class="wl">2</span><span class="wq">«{a^nb^m | n≤m}»</span></summary><div><p>«S→aSb | Sb | ε». ‏aSb מתאים זוגות, ו-Sb מוסיף b-ים עודפות. (לחלופין: «S→aSb | B», «B→bB | ε».)</p></div></details>
<details class="wex"><summary><span class="wl">3</span><span class="wq">«{a^mb^k | m<2k}» (2020)</span></summary><div><p>«S→Sb | aSb | aaSb | b | ab». כל b "לוקחת" 0, 1 או 2 a-ים. הבסיס b או ab לוקח לכל היותר a אחת, ולכן יש פחות מ-2k.</p></div></details>
<details class="wex"><summary><span class="wl">4</span><span class="wq">«{a^mbc^k | 2m<k<3m}» (2020)</span></summary><div>
<ol><li>כל a מקבלת 2 או 3 c-ים: «S→aScc | aSccc».</li>
<li>צריך <b>אי-שוויון חזק</b> בשני הצדדים. נבדוק מה ה-m הכי קטן: «m=1»: ‏«2<k<3», אין k כזה. «m=2»: ‏«4<k<6», ולכן «k=5».</li>
<li>הבסיס: «aabccccc» (m=2, k=5).</li>
<li>בדיקה: מוסיפים j a-ים, וה-k בין «5+2j» ל-«5+3j». צריך «4+2j<k<6+3j» ✓.</li></ol></div></details>
<details class="wex"><summary><span class="wl">5</span><span class="wq">«{a^nb^mc^md^n}»: התאמה מקוננת</span></summary><div><p>«S→aSd | X», «X→bXc | ε». החיצוני (a…d) עוטף את הפנימי (b…c).</p></div></details>
<details class="wex"><summary><span class="wl">6</span><span class="wq">«{a^nb^na^kb^k}»: שרשור</span></summary><div><p>«S→XX», «X→aXb | ε». שני חלקים בלתי תלויים, שכל אחד מהם «a^nb^n». (זו שאלת זיהוי מ-2018.)</p></div></details>
<details class="wex"><summary><span class="wl">7</span><span class="wq">«{a^ib^jc^k | i=j או j=k}»: איחוד</span></summary><div><p>«S→XC | AY», «X→aXb | ε», «C→cC | ε», «A→aA | ε», «Y→bYc | ε». מקרה ראשון «a^nb^nc^*», מקרה שני «a^*b^nc^n».</p></div></details>
<details class="wex"><summary><span class="wl">8</span><span class="wq">«{a^{m−k}b^mc^k | m≥k, m≥1}» (2026)</span></summary><div>
<ol><li>הטריק: מפרקים את «b^m» ל-«b^{m−k}·b^k».</li>
<li>המילה היא «a^{m−k}b^{m−k}·b^kc^k», כלומר שני חלקים מוכרים.</li>
<li>«X→aXb | ε», «Y→bYc | ε».</li>
<li>«m≥1» אומר שיש לפחות b אחת: «S→aXbY | XbYc».</li></ol></div></details>
<details class="wex"><summary><span class="wl">9</span><span class="wq">«{uv | u∈{0,1}^*, v∈{2,3}^*, |u|≤#_2(v)}» (2024)</span></summary><div><p>«S→0S2 | 1S2 | S2 | S3 | ε». כל אות של u עוטפת 2, ואפשר להוסיף 2-ים ו-3-ים חופשיים מימין.</p></div></details>`},
{t:'ספירה: «#_a=#_b» ומשפחתה', h:`
<details class="wex"><summary><span class="wl">קלאסי</span><span class="wq">«{w | #_a(w)=#_b(w)}»: למה «S→aSbS | bSaS | ε»?</span></summary><div>
<p><b>הרעיון:</b> מילה מאוזנת לא ריקה מתחילה ב-a או ב-b. נניח שהיא מתחילה ב-a. נלך משמאל ונעקוב אחרי ההפרש «#_a−#_b». הוא מתחיל ב-1, ובסוף הוא 0, ולכן יש נקודה <b>ראשונה</b> שבה הוא חוזר ל-0, וזה קורה על b.</p>
<p>לכן «w=a·x·b·y», כאשר x מאוזנת (בין ה-a ל-b ההפרש לא ירד מתחת ל-1) ו-y מאוזנת. זה בדיוק «aSbS».</p>
<p>דקדוק שקול (2018): «S→aSb | bSa | SS | ε».</p></div></details>
<details class="wex"><summary><span class="wl">2018</span><span class="wq">«{w | #_a=#_b+2}»</span></summary><div><p>«S→XaXaX», «X→aXbX | bXaX | ε». ‏X מייצר חלקים מאוזנים, ושתי ה-a-ים העודפות מפוזרות ביניהם.</p></div></details>
<details class="wex"><summary><span class="wl">שאלה</span><span class="wq">האם «S→aSb | bSa | ε» מקבל את כל «#_a=#_b»?</span></summary><div><p>לא. הוא מייצר רק מילים שבהן האות הראשונה <b>שונה</b> מהאחרונה, ובאופן רקורסיבי פנימה. למשל abba לא מתקבלת (a…a בקצוות). בגלל זה צריך את «SS» או את «aSbS».</p></div></details>`},
{t:'פלינדרומים, לא-פלינדרומים ו-ww', h:`
<details class="wex"><summary><span class="wl">1</span><span class="wq">פלינדרומים</span></summary><div><p>«S→aSa | bSb | a | b | ε». מוסיפים אותה אות בשני הצדדים. ‏a או b באמצע נותנים אורך אי-זוגי, ו-«ε» נותן אורך זוגי.</p></div></details>
<details class="wex"><summary><span class="wl">2</span><span class="wq">לא-פלינדרומים <mark>(4 מבחנים)</mark></span></summary><div>
<ol><li>מילה אינה פלינדרום ⟺ יש מקום <b>ראשון</b> (מבחוץ פנימה) שבו האותיות התואמות שונות.</li>
<li>מבחוץ: זוגות שווים, «S→aSa | bSb».</li>
<li>בנקודת השבירה: זוג שונה, «aXb | bXa».</li>
<li>אחרי השבירה הכל מותר: «X→aX | bX | ε».</li></ol>
<p>«S→aSa | bSb | aXb | bXa», ‏«X→aX | bX | ε».</p></div></details>
<details class="wex"><summary><span class="wl">3</span><span class="wq">לא-פלינדרומים באורך <b>אי-זוגי</b> (2025)</span></summary><div>
<p>«S→TST | aXb | bXa», ‏«X→TXT | a | b», ‏«T→a | b».</p>
<p>כאן ‏TST מבחוץ (זוג כלשהו, וזה בסדר כי השבירה תגיע בפנים). X מוסיף זוגות ובאמצע אות אחת, ולכן האורך אי-זוגי. לאורך זוגי: «X→TXT | ε».</p></div></details>
<details class="wex"><summary><span class="wl">4</span><span class="wq">אורך זוגי ו<b>לא</b> מהצורה ww (2023)</span></summary><div>
<p>«S→XY | YX», ‏«X→TXT | a», ‏«Y→TYT | b».</p>
<p><b>למה זה עובד?</b> מילה באורך 2n אינה ww ⟺ יש מקום i שבו «w[i]≠w[i+n]». ‏X מייצר מילה באורך אי-זוגי עם a באמצע, ו-Y אותו דבר עם b. כשמשרשרים X באורך «2p+1» ו-Y באורך «2q+1», האות האמצעית של X והאות האמצעית של Y נמצאות בדיוק במרחק n זו מזו. הטריק הוא שאפשר "להזיז" את גבולות החלוקה.</p>
<p>(כל המילים שאינן ww: מוסיפים גם את כל המילים באורך אי-זוגי.)</p></div></details>
<details class="wex"><summary><span class="wl">5</span><span class="wq">«{uu^Rv^Rv}» (2024)</span></summary><div><p>«uu^R» הוא פלינדרום זוגי, וגם «v^Rv». לכן «S→XX», ‏«X→0X0 | 1X1 | ε».</p></div></details>
<details class="wex"><summary><span class="wl">6</span><span class="wq">«{v2w | v≠w^R}» מעל «{0,1,2}» (2023)</span></summary><div>
<p>«v=w^R» פירושו שהמילה היא "פלינדרום סביב ה-2". צריך עדות לשבירה:</p>
<ul><li>זוגות מבחוץ, כלשהם: «S→TST».</li>
<li>אי-התאמה: «0X2X1 | 1X2X0», ואחרי השבירה הכל מותר.</li>
<li>או שאחד הצדדים ארוך יותר: «TX2 | 2XT».</li></ul>
<p>«X→TX | ε», ‏«T→0 | 1».</p></div></details>`},
{t:'זיהוי השפה של דקדוק נתון', h:`
<ol>
<li><b>גוזרים</b> 4–5 מילים קצרות (או משתמשים בכלי למטה).</li>
<li><b>מחפשים אינווריאנטה:</b> מה נשמר בכל כלל? (כמה a-ים מול כמה b-ים, סימטריה, אורך זוגי)</li>
<li><b>בודקים משתנים "מתים":</b> משתנה שבכל הכללים שלו מופיע משתנה לא יכול להסתיים. אם S תלוי בו, השפה היא «∅».</li>
<li><b>בודקים את התשובות</b> עם מילה קצרה שמבדילה ביניהן.</li>
</ol>
<details class="wex"><summary><span class="wl">2025</span><span class="wq">«S→XY», «X→aXb|bXa|aXa|bXb|ε», «Y→aYa|bYb|aYb|bYa»</span></summary><div><p>ל-Y אין כלל בלי Y, ולכן הוא אף פעם לא נגמר. «L=∅».</p></div></details>
<details class="wex"><summary><span class="wl">2023</span><span class="wq">«S→0S2 | X», «X→1X2 | 1X | 1» מול «L'={0^m1^t2^k | m+t>k}»</span></summary><div>
<p>הדקדוק: כל 0 עוטפת 2. ב-X כל 1 עוטפת 2 או עומדת לבד, ותמיד יש 1 אחת לבד לפחות. לכן «k<m+t», כלומר «L(G)⊆L'».</p>
<p>אבל הדקדוק תמיד מייצר לפחות 1 אחת. המילה 002 (m=2, t=0, k=1) נמצאת ב-«L'» אבל לא ב-«L(G)». לכן ההכלה ממש.</p></div></details>
<details class="wex"><summary><span class="wl">2022</span><span class="wq">«G'» מצורת חומסקי עם משתנים מתויגים «X'», «X'→Y'Z | YZ'», «X'→ε»</span></summary><div><p>המשתנה המתויג "נושא" משימה: למחוק <b>אות אחת</b>. בכל פיצול הוא מעביר את התיוג לאחד הילדים, ובעלה הוא מוחק את האות. התוצאה: מילים מ-L שהוסרה מהן אות אחת (בכל מקום).</p></div></details>`},
{t:'דקדוקים כלליים (לא ח״ה)', h:`
<p>ב<b>דקדוק כללי</b> מותר שיהיו בצד שמאל כמה סימנים, למשל «AB→BA». זה מאפשר "להזיז" אותיות ולתקשר בין חלקים רחוקים במילה. הכוח שלו שקול למכונת טיורינג.</p>
<details class="wex"><summary><span class="wl">2020</span><span class="wq">«S→ABCS | ε» + כל ההחלפות + «A→a, B→b, C→c»</span></summary><div><p>מייצרים כמויות שוות של A, B ו-C, וההחלפות מאפשרות כל סידור. השפה: «{#_a=#_b=#_c}».</p></div></details>
<details class="wex"><summary><span class="wl">2018</span><span class="wq">כתבו דקדוק ל-«#_a=2#_b=3#_c»</span></summary><div><p>היחס הוא «6:3:2». ‏«S→AAAAAABBBCCS | ε», וכל 6 ההחלפות («AB→BA, BA→AB, AC→CA, CA→AC, BC→CB, CB→BC»), ו-«A→a, B→b, C→c».</p></div></details>
<details class="wex"><summary><span class="wl">2023</span><span class="wq">«S→MR», «M→aMbX | ε», «Xb→bX», «XR→Rc», «R→ε»</span></summary><div>
<p>«M→aMbX» נותן «a^n(bX)^n». כל X "זוחל" ימינה מעל b-ים («Xb→bX»), וכשהוא פוגש את R הוא הופך ל-c שמאחוריו («XR→Rc»). בסוף «R→ε».</p>
<p>התוצאה: «a^nb^nc^n».</p></div></details>
<details class="wex"><summary><span class="wl">2022</span><span class="wq">«S→MR», ‏M מייצר «Xw», ‏X מעתיק כל אות אל אחרי R</span></summary><div><p>X עובר על w משמאל לימין. על כל אות הוא שולח עותק (A או B) שזוחל ימינה ונכנס <b>מיד אחרי R</b>. העותק הראשון נדחף הכי רחוק ימינה, ולכן העותקים יוצאים בסדר הפוך: «w·w^R». התשובה: «{ww^R}».</p></div></details>`}
]},

{id:'cfl', name:'שפות ח״ה, בר-הלל וחומסקי', short:'מה ח״ה ומה לא, סגירות, היררכיה', tool:'pda',
sections:[
{t:'אוטומט מחסנית', h:`
<p>אוטומט מחסנית הוא אוטומט סופי + <b>מחסנית</b> (ערימה: מכניסים ומוציאים רק מלמעלה). בכל צעד הוא קורא אות (או «ε»), מסתכל על ראש המחסנית, ומחליט לאיזה מצב לעבור ומה להכניס במקום הראש.</p>
<p><b>משפט:</b> שפה היא ח״ה ⟺ יש לה אוטומט מחסנית (לא דטרמיניסטי).</p>
<details class="wex" open><summary><span class="wl">דוגמה</span><span class="wq">איך מחסנית מזהה «a^nb^n»?</span></summary><div>
<ol><li>על כל a: דוחפים סימן A.</li><li>על כל b: מוציאים A. אם המחסנית ריקה, דוחים.</li><li>אם מגיע a אחרי b, דוחים.</li><li>בסוף: מקבלים אם המחסנית ריקה.</li></ol>
<p>המחסנית היא בעצם <b>מונה אחד</b>. אפשר לבדוק את זה בכלי למטה.</p></div></details>
<p><b>מה מחסנית לא יכולה?</b> להשוות <b>שני</b> זוגות בבת אחת. ב-«a^nb^nc^n», אחרי שהשתמשנו במחסנית כדי לבדוק a מול b, היא ריקה ואין עם מה להשוות את ה-c-ים.</p>`},
{t:'היררכיית חומסקי', h:`

<div class="cap">כל מחלקה מכילה את כל המחלקות שבתוכה. דוגמה מכל שכבה מופיעה בכחול.</div></div>
<ul>

{id:'17m4',x:'17m',t:'fa',k:'mc',rep:'flipnfa',q:`באסל״ד A (מכל מצב יוצאת לפחות קשת אחת לכל אות) הופכים את המצבים המקבלים ללא מקבלים ולהפך, ומקבלים את B. מה נכון?`,o:[`«L(B)⊇!{L(A)}»`,`«L(B)=!{L(A)}»`,`«L(B)⊆!{L(A)}»`,`«L(B)≠!{L(A)}»`],e:`מילה ש-A דוחה (כל המסלולים שלה נכשלים) תתקבל ב-B. אבל מילה ש-A מקבל יכולה גם להתקבל ב-B, אם יש לה גם מסלול שנכשל.`},
{id:'17m5',x:'17m',t:'regex',k:'mc',q:`איזה ביטוי מקבל את המילים שמתחילות ב-00 ולא מכילות 000?`,o:[`«00(1+10+100)^*»`,`«(1+01+001)^*00»`,`«00(1+01)^*(ε+0)»`,`«001^+(ε+0)»`],e:`אחרי 00 חייבת לבוא 1, ואחריה בלוקים של 1, 10 או 100. התשובה השלישית לא מקבלת את 00100.`},
{id:'17m6',x:'17m',t:'regex',k:'mc',q:`בהוכחת משפט קלין, «r_{ij}^k» מקבל את המחרוזות שיש להן מסלול מ-«q_i» ל-«q_j», ו…`,o:[`שעשויות לעבור במצבי הביניים «q_1,…,q_k»`,`שאורכן לכל היותר k`,`שעוברות לכל היותר דרך k מצבים`,`שעוברות דרך מצב הביניים «q_k»`],e:`זו ההגדרה של בניית התכנון הדינמי בהוכחה.`},
{id:'17m8',x:'17m',t:'closure',k:'mc',q:`אם L רגולרית, אוסף הפלינדרומים ב-L הוא שפה:`,o:[`אף אחת מהתשובות האחרות אינה בהכרח נכונה`,`סופית`,`רגולרית`,`לא רגולרית`],e:`עבור «L=a^*» מתקבלת «a^*» (רגולרית ואינסופית). עבור «L=Σ^*» מתקבלים כל הפלינדרומים (לא רגולרית).`},
{id:'17m9',x:'17m',t:'pump',k:'mc',q:`L שפה סופית. איזו טענה <b>אינה</b> בהכרח נכונה?`,o:[`L אינה מקיימת את למת הניפוח`,`קיים ביטוי רגולרי שמקבל את L`,`קיים אסל״ד שמקבל את L`,`L מקיימת את למת הניפוח`],e:`שפה סופית היא רגולרית, ולכן מקיימת את הלמה (באופן ריק).`},
{id:'17m10',x:'17m',t:'closure',k:'mc',q:`טענה: אם A רגולרית ו-«A⊡B» רגולרית, אז B רגולרית. עבור איזו פעולה «⊡» הטענה נכונה?`,o:[`«Δ»`,`«∪»`,`«∩»`,`«−»`],e:`«B=AΔ(AΔB)», וזה הפרש סימטרי של שתי שפות רגולריות. עם שאר הפעולות, «A=Σ^*» או «A=∅» מפריכות את הטענה.`},
{id:'17m11',x:'17m',t:'fa',k:'open',q:`נתון אס״ד A מעל «{a,b,c}». בנו אס״ד B שמקבל את «(L(A)∪{b})−{ε}» בלי אוטומט מכפלה.`,s:`מוסיפים מצב התחלה חדש «q_{00}» (לא מקבל) ומצב «q_b» (מקבל).<br>«δ'(q_{00},σ)=δ(q_0,σ)» לכל «σ≠b», ו-«δ'(q_{00},b)=q_b». מ-«q_b» ממשיכים כמו «δ(q_0,b)»: «δ'(q_b,σ)=δ(δ(q_0,b),σ)».<br>«F'=F∪{q_b}». «ε» נדחית כי «q_{00}» לא מקבל.`},
{id:'17m12',x:'17m',t:'pump',k:'open',q:`הוכיחו בעזרת למת הניפוח ש-«L={ba^kba^t | k≠t}» אינה רגולרית.`,s:`נניח בשלילה, ונבחר «z=ba^nba^{n+n!}».<br>אם «v=a^t» (אחרי ה-b הראשונה), נבחר «i=n!/t+1» ונקבל «ba^{n+n!}ba^{n+n!}∉L».<br>אם v מכילה את ה-b הראשונה, נבחר «i=0» ונקבל מילה שלא מתחילה ב-b, ולכן אינה ב-L. בשני המקרים יש סתירה.`},
/* 2018 a */
{id:'18a1',x:'18a',t:'cfl',k:'mc',q:`«L_1» רגולרית ו-«L_2» ח״ה ולא רגולרית. מה אפשר לומר על «L_2−L_1»?`,o:[`ח״ה`,`רגולרית`,`לא רגולרית`,`לא ח״ה`],e:`«L_2−L_1=L_2∩!{L_1}», חיתוך של ח״ה עם רגולרית. היא יכולה להיות רגולרית (למשל «L_1=Σ^*» נותן «∅»), ולכן התשובה היא רק "ח״ה".`},
{id:'18a2',x:'18a',t:'nerode',k:'mc',q:`אילו שפות מקיימות «R_L=R_{!{L}}»?`,o:[`כל שפה`,`רק שפות רגולריות`,`רק שפות ח״ה`,`אף שפה`],e:`z מפרידה בין x ל-y עבור L בדיוק כשהיא מפרידה ביניהן עבור המשלים.`},
{id:'18a3',x:'18a',t:'cfl',k:'mc',rep:'twocmp',q:`«L={w∈{a,b,c}^* | #_a>#_b>#_c}». מה נכון?`,o:[`«!{L}» ח״ה ו-L אינה ח״ה`,`L ו-«!{L}» ח״ה`,`L ח״ה ו-«!{L}» אינה ח״ה`,`L ו-«!{L}» אינן ח״ה`],e:`L דורשת שתי השוואות בו-זמנית. המשלים הוא «#_a≤#_b ∪ #_b≤#_c», איחוד של שתי שפות ח״ה.`},
{id:'18a4',x:'18a',t:'lang',k:'mc',rep:'plus',q:`איזו שפה <b>אינה</b> מקיימת «L^+=L^*»?`,o:[`«{w | |w| mod 2=1}»`,`«{ε,a,ba}»`,`«{w | #_a(w)<3}»`,`«{w | w^R=w}»`],e:`רק בשפה של האורך האי-זוגי אין «ε».`},
{id:'18a5',x:'18a',t:'pump',k:'mc',q:`מוכיחים בלמת הניפוח ש-«{a^{k³}}» אינה רגולרית, עם «z=a^{n³}». אילו ערכים של i מתאימים?`,o:[`גם «i=3» וגם «i=5»`,`«i=3» אבל לא «i=5»`,`«i=5» אבל לא «i=3»`,`לא «i=3» וגם לא «i=5»`],e:`«n³<n³+(i−1)t≤n³+4n<(n+1)³=n³+3n²+3n+1». האורך נופל בין שתי חזקות שלישיות עוקבות.`},
{id:'18a6',x:'18a',t:'cfg',k:'mc',rep:'eqab',q:`איזו שפה מקבל «S→aSb|bSa|SS|ε»?`,o:[`«{w | #_a(w)=#_b(w)}»`,`«{w | w^R=w}»`,`«{w | w^R≠w}»`,`«{ww}»`],e:`כל כלל מוסיף a ו-b יחד. ההרכבה SS מכסה את כל הסידורים.`},
{id:'18a7',x:'18a',t:'regex',k:'mc',q:`איזו מילה <b>אינה</b> מתקבלת ע״י «(0(0(01)^*1)^*1)^*»?`,o:[`011001`,`010011`,`001011`,`000111`],e:`כל בלוק חיצוני מתחיל ב-0. אחרי 01 נשאר 1001, שמתחיל ב-1, ולכן לא ניתן לפרק אותו.`},
{id:'18a8',x:'18a',t:'cfl',k:'mc',q:`L ח״ה, ו-A היא קבוצת המילים ב-L שאינן מקיימות את תנאי למת בר-הלל. מה אפשר לומר על A?`,o:[`רגולרית`,`לא רגולרית, ואולי ח״ה`,`ח״ה, ואולי לא רגולרית`,`לא ח״ה`],e:`רק מילים קצרות מ-n לא מקיימות את התנאי. זו קבוצה סופית, ולכן רגולרית.`},
{id:'18a9',x:'18a',t:'fa',k:'mc',q:`באסל״ד יש מעבר «q_0 →(ε,a) q_1» ומעבר «q_1 →(ε,b) q_2». מהו «CL_ε(q_1)»?`,o:[`«{q_1,q_2}»`,`«{q_0,q_1}»`,`«{q_1}»`,`«{q_2}»`],e:`מ-«q_1» אפשר להגיע ל-«q_2» במסע «ε», ו-«q_1» עצמו תמיד בפנים.`},
{id:'18a10',x:'18a',t:'fa',k:'mc',rep:'product',q:`מהם המצבים המקבלים באוטומט המכפלה עבור «L_1ΔL_2»?`,o:[`«(F_1×!{F_2})∪(!{F_1}×F_2)»`,`«F_1ΔF_2»`,`«Q_1ΔF_2»`,`«Q_1×F_2»`],e:`בדיוק אחד מהאוטומטים מקבל.`},
{id:'18a11',x:'18a',t:'cfg',k:'open',q:`רשמו דקדוק ח״ה ל-«{w∈{a,b}^* | #_a(w)=#_b(w)+2}».`,s:`«S→XaXaX», «X→aXbX | bXaX | ε».<br>X מייצר מילים מאוזנות («#_a=#_b»), ומשבצים ביניהן שתי a-ים עודפות.`},
{id:'18a12',x:'18a',t:'nerode',k:'open',rep:'nerodeproof',q:`הוכיחו בעזרת משפט נרוד ש-«{w∈{a,b,c}^* | #_a(w)=#_b(w)·#_c(w)}» אינה רגולרית.`,s:`«w_i=a^i». עבור «i≠j» נבחר «z=b^ic». אז «a^ib^ic∈L» («i=i·1»), אבל «a^jb^ic∉L». לכן יש אינסוף מחלקות.`},
/* 2018 b */
{id:'18b1',x:'18b',t:'pump',k:'mc',q:`L אינה רגולרית. איזו טענה <b>ייתכן שאינה נכונה</b>?`,o:[`L אינה מקיימת את למת הניפוח`,`L אינסופית`,`ל-«R_L» אינסוף מחלקות`,`אין ביטוי רגולרי שמקבל את L`],e:`יש שפות לא רגולריות שמקיימות את הלמה. שלוש הטענות האחרות נובעות מכך ש-L אינה רגולרית.`},
{id:'18b2',x:'18b',t:'nerode',k:'mc',rep:'primes',q:`«L={a^p | p ראשוני}». כמה מצבים יש באס״ד המינימלי של «L^*»?`,o:[`3`,`2`,`5`,`אין אס״ד ל-«L^*»`],e:`«L^*={a^n | n≠1}» (כל «n≥2» הוא סכום של 2-ים ו-3-ים). המצבים: «ε», «a», «aa+».`},
{id:'18b3',x:'18b',t:'cfl',k:'mc',rep:'ksq',q:`«L={a^{k²} | k≥0}». מה נכון?`,o:[`L ו-«!{L}» אינן ח״ה`,`L ו-«!{L}» ח״ה`,`L ח״ה ו-«!{L}» אינה ח״ה`,`«!{L}» ח״ה ו-L אינה ח״ה`],e:`מעל אות אחת, ח״ה ⟺ רגולרית. L אינה רגולרית, ולכן גם המשלים שלה לא, ואף אחת מהן אינה ח״ה.`},
{id:'18b4',x:'18b',t:'regex',k:'mc',q:`מהו הביטוי הרגולרי ל-«{w∈{0,1}^* | |#_0(w)−#_1(w)|≤2}»?`,o:[`לא קיים ביטוי רגולרי לשפה`,`«(01+10)^*»`,`«(0(01)^*1+1(10)^*0)^*»`,`«(0(01)^*1+1(01)^*0)·(ε+0+00)»`],e:`התנאי הוא על <i>כל המילה</i> ולא על כל רישא, ולכן ההפרש באמצע המילה לא חסום. השפה אינה רגולרית.`},
{id:'18b5',x:'18b',t:'cfl',k:'mc',q:`מוכיחים בבר-הלל ש-«{ww}» אינה ח״ה. איזו z מתאימה?`,o:[`«b^na^nb^na^n»`,`«a^nba^nb»`,`«a^{2n}ba^{2n}b»`,`«(ab)^n(ab)^n»`],e:`vwx באורך עד n נוגע לכל היותר בשני בלוקים סמוכים, וניפוח שובר את המבנה ww. ב-«a^nba^nb» אפשר לבחור את v ו-x כך שהמילה המנופחת נשארת ב-«{ww}».`},
{id:'18b6',x:'18b',t:'closure',k:'mc',q:`L רגולרית. «L_{min}» = מילים ב-L שאין להן רישא אמיתית ב-L. «L_{max}» = מילים ב-L שאינן רישא אמיתית של מילה אחרת ב-L. מה נכון?`,o:[`«L_{min}» ו-«L_{max}» רגולריות`,`שתיהן לא בהכרח רגולריות`,`רק «L_{min}» רגולרית בהכרח`,`רק «L_{max}» רגולרית בהכרח`],e:`בשתיהן אפשר לשנות את האוטומט: ל-«L_{min}» חוסמים יציאה ממצב מקבל, ול-«L_{max}» משאירים מקבלים רק מצבים שמהם אין מסלול למצב מקבל.`},
{id:'18b7',x:'18b',t:'nerode',k:'mc',rep:'7inf',q:`ל-«R_L» יש 7 מחלקות ול-«R_M» יש «∞». כמה מחלקות יש ל-«R_{L∩M}»?`,o:[`אי אפשר לדעת (ייתכן 1, ייתכן «∞»)`,`בדיוק 7`,`לכל היותר 7`,`«∞»`],e:`אותה שאלה כמו ב-2017. אם השפות זרות יש מחלקה אחת, ואם «M⊆L» יש אינסוף.`},
{id:'18b8',x:'18b',t:'regex',k:'mc',rep:'kleene',q:`מה קובע משפט קלין?`,o:[`לכל שפה רגולרית קיים ביטוי רגולרי שמקבל אותה`,`כל שפה רגולרית מתקבלת ע״י אוטומט סופי`,`לכל אסל״ד יש אס״ד שקול`,`מספר המחלקות של כל שפה רגולרית סופי`],e:`קלין עוסק בביטויים רגולריים. התשובה השלישית היא בניית אוטומט החזקה, והרביעית היא משפט נרוד.`},
{id:'18b10',x:'18b',t:'cfg',k:'mc',q:`מה השפה של «S→XX», «X→aXb|ε»?`,o:[`«{a^nb^na^kb^k | n,k≥0}»`,`«{ww}»`,`«{a^nb^na^nb^n}»`,`«{a^{2n}b^{2n}}»`],e:`כל X מייצר «a^nb^n» בנפרד, ולכן אין קשר בין n ל-k.`},
{id:'18b11',x:'18b',t:'cfg',k:'open',q:`רשמו דקדוק <b>כללי</b> ל-«{w∈{a,b,c}^* | #_a(w)=2·#_b(w)=3·#_c(w)}».`,s:`היחס הוא «a:b:c=6:3:2».<br>«S→AAAAAABBBCCS | ε»<br>«AB→BA, BA→AB, AC→CA, CA→AC, BC→CB, CB→BC»<br>«A→a, B→b, C→c»`},
{id:'18b12',x:'18b',t:'closure',k:'open',rep:'ksq',q:`הוכיחו או הפריכו: אם L אינה רגולרית, אז אוסף תתי-המילים של L אינו רגולרי.`,s:`<b>הפרכה:</b> «L={a^{k²}}» אינה רגולרית, אבל אוסף תתי-המילים שלה הוא «{a^n | n≥0}», שהוא רגולרי.`},
/* 2020 a */
{id:'20a1',x:'20a',t:'cfl',k:'mc',q:`מהו הקבוע n בלמת בר-הלל?`,o:[`«2^k», כאשר k = מספר המשתנים בדקדוק בצורת חומסקי`,`«k^2», כאשר k = מספר המשתנים בצורת גרייבך`,`«k!», כאשר k = מספר המצבים באוטומט המחסנית`,`«k(k−1)», כאשר k = גודל א״ב המחסנית`],e:`בצורת חומסקי עץ הגזירה בינארי, ולכן מילה באורך גדול מ-«2^k» מחייבת שמשתנה יחזור על עצמו במסלול כלשהו.`},
{id:'20a2',x:'20a',t:'closure',k:'mc',rep:'shuffle',q:`L רגולרית. «L'» = כל המילים שמתקבלות מערבוב כלשהו של מילה מ-L. מה אפשר לומר על «L'»?`,o:[`ייתכן שאינה ח״ה`,`רגולרית`,`לא רגולרית`,`ח״ה, ואולי לא רגולרית`],e:`«L=(abc)^*» הופכת ל-«#_a=#_b=#_c», שאינה ח״ה.`},
{id:'20a3',x:'20a',t:'nerode',k:'mc',q:`«L={a^mb^k | m>k}». טענה 1: «a^5» ו-«a^6b» באותה מחלקה. טענה 2: «b» ו-«ab^2» באותה מחלקה.`,o:[`רק טענה 2`,`רק טענה 1`,`שתי הטענות`,`אף טענה`],e:`«z=a» מפרידה: «a^6∈L», אבל «a^6ba∉L». המילים b ו-«ab^2» כבר נפסלו, ושום המשך לא יכניס אותן לשפה, ולכן הן באותה מחלקה (המלכודת).`},
{id:'20a4',x:'20a',t:'closure',k:'mc',q:`L סופית. איזו טענה <b>אינה</b> בהכרח נכונה?`,o:[`לכל שפה M, «LΔM» רגולרית`,`«L^*» מקיימת את בר-הלל`,`ל-«R_{!{L}}» מספר סופי של מחלקות`,`«L^R» מקיימת את למת הניפוח`],e:`אם «L=∅» ו-M אינה רגולרית, אז «LΔM=M» אינה רגולרית.`},
{id:'20a5',x:'20a',t:'cfl',k:'mc',q:`מוכיחים בבר-הלל ש-«{#_a<#_b<#_c}» אינה ח״ה. איזו z כדאי לבחור?`,o:[`«a^nc^{n+2}b^{n+1}»`,`«(abbccc)^n»`,`«a^nb^{2n}c^{3n}»`,`«(ab)^nbc^{n+2}»`],e:`בלוק ה-c-ים מפריד בין ה-a-ים ל-b-ים, ולכן vwx לא נוגע בשניהם. בכל מקרה ניפוח מעלה או מטה שובר את אחד האי-שוויונות. ב-«(abbccc)^n» אפשר לבחור «v=ab», «x=c», ובשאר הבחירות יש מרווח מספיק.`},

{id:'20b5',x:'20b',t:'lang',k:'mc',q:`«L_1={w | ww∈L}», «L_2={ww | ww∈L}». מה נכון?`,o:[`«L_2⊆L_1·L_1», וייתכן שלא שוות`,`«L_2=L_1·L_1»`,`«L_1·L_1⊆L_2», וייתכן שלא שוות`,`«L_2≠L_1·L_1»`],e:`עבור «L={aa,bb}»: «L_1={a,b}», ולכן «L_1L_1» מכילה את ab, שאינה ב-«L_2».`},

{id:'22a4',x:'22a',t:'regex',k:'mc',rep:'kleene',q:`מה קובע משפט קלין?`,o:[`L רגולרית ⟺ קיים ביטוי רגולרי שמקבל את L`,`L רגולרית ⟺ קיים דקדוק לינארי ימני`,`L רגולרית ⟺ קיים אוטומט סופי`,`L רגולרית ⟺ מספר המחלקות סופי`],e:`קלין = ביטויים רגולריים.`},

const app = document.getElementById('app');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function mx(x){
  return esc(x)
    .replace(/!\{([^}]*)\}/g,'<span class="ov">$1</span>')
    .replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>')
    .replace(/_\{([^}]*)\}/g,'<sub>$1</sub>')
    .replace(/\^([A-Za-z0-9*+])/g,'<sup>$1</sup>')
    .replace(/_([A-Za-z0-9])/g,'<sub>$1</sub>');
}
function fm(s){ return s.replace(/«([^»]*)»/g,(m,x)=>'<span class="m'+(x.length>34?' wrapok':'')+'" dir="ltr">'+mx(x)+'</span>'); }
const topicById = id => TOPICS.find(t=>t.id===id);
const examById = id => EXAMS.find(e=>e.id===id);
const realQ = Q.filter(q=>q.x!=='prac');
const repCount = {}; realQ.forEach(q=>{ if(q.rep) repCount[q.rep]=(repCount[q.rep]||0)+1; });
const sl = s => s===''?'ε':s;
const cnt = (w,c) => w.split(c).length-1;

let progress = {};
try { progress = JSON.parse(localStorage.getItem('modelim-progress')||'{}') || {}; } catch(e){ progress = {}; }
function saveProg(){ try{ localStorage.setItem('modelim-progress', JSON.stringify(progress)); }catch(e){} }

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function wordsUpTo(al, L){ const out=['']; let layer=['']; for(let k=1;k<=L;k++){ const nx=[]; for(const w of layer) for(const c of al) nx.push(w+c); out.push(...nx); layer=nx; } return out; }

function qCard(q){
  const el = document.createElement('div'); el.className='q';
  const tp = topicById(q.t), ex = examById(q.x);
  const st = progress[q.id];
  let head = `<div class="qhead">`;
  head += q.x==='prac' ? `<span class="tag prac">תרגול נוסף</span>` : `<span class="tag">${ex.name}</span>`;
  head += `<span class="tag">${tp.name}</span>`;
  if(q.k==='open') head += `<span class="tag open">שאלה פתוחה</span>`;
  if(q.rep && repCount[q.rep]>1) head += `<span class="tag rep">חוזרת ×${repCount[q.rep]}: ${fm(REP[q.rep])}</span>`;
  if(st) head += `<span class="tag ${st==='ok'?'done-ok':'done-bad'}">${st==='ok'?'ידעתי':'לחזור'}</span>`;
  head += `</div>`;
  el.innerHTML = head + `<div class="qtext">${fm(q.q)}</div>`;
  if(q.k==='mc'){
    const box = document.createElement('div'); box.className='opts';
    const order = shuffle(q.o.map((_,i)=>i));
    const letters = ['א','ב','ג','ד'];
    const btns = order.map((oi,pos)=>{
      const b = document.createElement('button'); b.className='opt'; b.type='button';
      b.innerHTML = `<span class="k">${letters[pos]}.</span><span>${fm(q.o[oi])}</span>`;
      b.onclick = ()=>{
        btns.forEach((bb,p)=>{ bb.disabled=true; if(order[p]===0) bb.classList.add('ok'); });
        const right = oi===0; if(!right) b.classList.add('bad');
        progress[q.id] = right?'ok':'bad'; saveProg();
        const ex = document.createElement('div'); ex.className='expl';
        ex.innerHTML = `<b class="${right?'v-ok':'v-bad'}">${right?'נכון.':'לא נכון.'}</b> ${fm(q.e)}`;
        el.appendChild(ex);
      };
      box.appendChild(b); return b;
    });
    el.appendChild(box);
  } else {
    const row = document.createElement('div'); row.className='row';
    const show = document.createElement('button'); show.className='btn ghost'; show.type='button'; show.textContent='הצג פתרון';
    row.appendChild(show); el.appendChild(row);
    show.onclick = ()=>{
      show.remove();
      const sol = document.createElement('div'); sol.className='sol'; sol.innerHTML = `<b>פתרון:</b><br>${fm(q.s)}`;
      el.appendChild(sol);
      const r2 = document.createElement('div'); r2.className='row'; r2.style.marginTop='10px';
      const ok = document.createElement('button'); ok.className='btn okb'; ok.type='button'; ok.textContent='ידעתי';
      const bad = document.createElement('button'); bad.className='btn badb'; bad.type='button'; bad.textContent='לא ידעתי, לחזור';
      ok.onclick=()=>{progress[q.id]='ok';saveProg();r2.innerHTML='<span class="counter">נשמר. השאלה סומנה כ"ידעתי".</span>';};
      bad.onclick=()=>{progress[q.id]='bad';saveProg();r2.innerHTML='<span class="counter">נשמר. השאלה תופיע במסנן "לחזור".</span>';};
      r2.append(ok,bad); el.appendChild(r2);
    };
  }
  return el;
}

function topicStats(id){
  const qs = Q.filter(q=>q.t===id), rq = qs.filter(q=>q.x!=='prac');
  return {n:qs.length, nExam:rq.length, exams:new Set(rq.map(q=>q.x)).size, done:qs.filter(q=>progress[q.id]==='ok').length};
}

const TOOLS = {};

/* --- language operations calculator --- */
TOOLS.lang = el => {
  el.innerHTML = `<div class="tt">מחשבון פעולות על שפות</div>
  <div class="td">כתבו שפה סופית (מילים מופרדות בפסיק, «ε» למילה הריקה), בחרו פעולה, וקבלו את כל המילים בתוצאה עד אורך 6.</div>
  <div class="fields"><div><label for="lg-in">השפה L</label><input type="text" id="lg-in" value="a, ab"></div>
  <div><label for="lg-op">פעולה</label><select id="lg-op"><option value="sq">L·L</option><option value="cube">L·L·L</option><option value="star" selected>L* (עד אורך 6)</option><option value="plus">L+ (עד אורך 6)</option><option value="rev">היפוך L^R</option><option value="pre">כל הרישות</option><option value="sub">כל תתי-המילים</option></select></div></div>
  <div class="out" id="lg-out"></div>`;
  const inp=el.querySelector('#lg-in'), op=el.querySelector('#lg-op'), out=el.querySelector('#lg-out');
  const run=()=>{
    const L=[...new Set(inp.value.split(',').map(s=>s.trim()).map(s=>s==='ε'||s==='e'?'':s.replace(/\s/g,'')))];
    const MAX=6; let R=new Set();
    const cat=(A,B)=>{const S=new Set();A.forEach(x=>B.forEach(y=>{if((x+y).length<=MAX)S.add(x+y);}));return S;};
    if(op.value==='sq') R=cat(L,L);
    else if(op.value==='cube') R=cat([...cat(L,L)],L);
    else if(op.value==='star'||op.value==='plus'){ let cur=new Set(op.value==='star'?['']:L.filter(w=>w.length<=MAX)); R=new Set(cur); if(op.value==='plus'){} for(let k=0;k<MAX+1;k++){ const nx=cat([...cur],L); let grew=false; nx.forEach(w=>{if(!R.has(w)){R.add(w);grew=true;}}); cur=nx; if(!grew)break; } }
    else if(op.value==='rev') L.forEach(w=>R.add([...w].reverse().join('')));
    else if(op.value==='pre') L.forEach(w=>{for(let i=0;i<=w.length;i++)R.add(w.slice(0,i));});
    else if(op.value==='sub') L.forEach(w=>{for(let i=0;i<=w.length;i++)for(let j=i;j<=w.length;j++)R.add(w.slice(i,j));});
    const arr=[...R].sort((a,b)=>a.length-b.length||a.localeCompare(b));
    out.innerHTML=`<div class="counter">${arr.length} מילים${(op.value==='star'||op.value==='plus')?' (עד אורך 6, השפה עצמה אינסופית אם יש בה מילה לא ריקה)':''}:</div><div class="wordlist">${arr.map(w=>`<span>${esc(sl(w))}</span>`).join('')||'∅'}</div>`;
  };
  inp.oninput=run; op.onchange=run; run();
};

  <div class="out" id="rx-out"></div>`;

    const t=tw.value.replace(/\s/g,''); const ok=re.test(t);
    out.innerHTML=`<p>המילה «${esc(sl(t))}»: <span class="verdict ${ok?'y':'n'}">${ok?'מתקבלת ✓':'לא מתקבלת ✗'}</span></p>

};

    });
    if(err||!start){ out.innerHTML=`<p class="verdict n">${esc(err||'אין כללים.')}</p>`; return; }
    const MAX=+len.value; const words=new Set(); const seen=new Set([start]); const queue=[start]; let steps=0, cut=false;
    while(queue.length){ if(++steps>150000){cut=true;break;} const f=queue.shift(); const i=f.search(/[A-Z]/);
      if(i<0){ if(f.length<=MAX) words.add(f); continue; }
      const V=f[i]; for(const alt of (rules[V]||[])){ const g=f.slice(0,i)+alt+f.slice(i+1); const term=g.replace(/[A-Z]/g,'').length; const vars=g.length-term; if(term>MAX||vars>MAX+3||seen.has(g))continue; seen.add(g); queue.push(g); } }
    const arr=[...words].sort((a,b)=>a.length-b.length||a.localeCompare(b));
    const t=tw.value.replace(/\s/g,'');
    const verdict = t.length>MAX ? `<span class="counter">המילה ארוכה מהאורך שנבחר.</span>` : (words.has(t)?`<span class="verdict y">נוצרת ✓</span>`:`<span class="verdict n">לא נוצרת ✗</span>`);
    out.innerHTML=`<p>המילה <span class="m" dir="ltr">${esc(sl(t))}</span>: ${verdict}</p><div class="counter">${arr.length} מילים עד אורך ${MAX}${cut?' (החיפוש נעצר מוקדם)':''}:</div><div class="wordlist">${arr.map(w=>`<span>${esc(sl(w))}</span>`).join('')||'(אף מילה, כלומר השפה ריקה עד האורך הזה)'}</div>`;
  };
  ta.oninput=run; len.onchange=run; tw.oninput=run; run();
};

TOOLS.pda = el => {
  el.innerHTML = `<div class="tt">מעקב אחרי מחסנית</div>
  <div class="td">רואים בדיוק מה המחסנית "זוכרת" בכל צעד. ראש המחסנית מימין.</div>
  <div class="fields"><div><label for="pd-m">מכונה</label><select id="pd-m"><option value="anbn">a^n b^n</option><option value="eq">#a = #b (כל סדר)</option><option value="wcw">w c w^R (פלינדרום עם סמן)</option></select></div>
  <div><label for="pd-w">מילה</label><input type="text" id="pd-w" value="aaabbb"></div></div>
  <div class="out" id="pd-out"></div>`;
  const m=el.querySelector('#pd-m'), w=el.querySelector('#pd-w'), out=el.querySelector('#pd-out');
  const run=()=>{
    const word=w.value.replace(/\s/g,''); let st=[]; const rows=[]; let ok=true, why='';
    if(m.value==='anbn'){ let phase='a';
      for(const c of word){ if(c==='a'){ if(phase==='b'){ok=false;why='a אחרי b';break;} st.push('A'); rows.push([c,'דחיפת A']); }
        else if(c==='b'){ phase='b'; if(!st.length){ok=false;why='b בלי A להוציא';break;} st.pop(); rows.push([c,'הוצאת A']); } else {ok=false;why='אות לא מוכרת';break;} rows[rows.length-1].push(st.join('')); }
      if(ok&&st.length){ok=false;why='נשארו A-ים במחסנית';}
    } else if(m.value==='eq'){
      for(const c of word){ const want=c==='a'?'B':'A', mine=c==='a'?'A':'B'; if(c!=='a'&&c!=='b'){ok=false;why='אות לא מוכרת';break;}
        if(st.length&&st[st.length-1]===want){ st.pop(); rows.push([c,`הוצאת ${want} (מתקזז)`,st.join('')]); } else { st.push(mine); rows.push([c,`דחיפת ${mine}`,st.join('')]); } }
      if(ok&&st.length){ok=false;why='נשאר עודף במחסנית';}
    } else { let phase='push';
      for(const c of word){ if(phase==='push'){ if(c==='c'){phase='pop';rows.push([c,'עוברים לשלב ההשוואה',st.join('')]);continue;} st.push(c.toUpperCase()); rows.push([c,`דחיפת ${c.toUpperCase()}`,st.join('')]); }
        else { if(c==='c'){ok=false;why='c שנייה';break;} if(!st.length||st[st.length-1]!==c.toUpperCase()){ok=false;why=`ציפינו ל-${st.length?st[st.length-1].toLowerCase():'סוף'} וקיבלנו ${c}`;break;} st.pop(); rows.push([c,`הוצאת ${c.toUpperCase()} (תואם)`,st.join('')]); } }
      if(ok&&(phase==='push'||st.length)){ok=false;why=phase==='push'?'אין c':'נשאר משהו במחסנית';}
    }
    out.innerHTML=`<div class="tscroll"><table><tr><th>צעד</th><th>אות</th><th>פעולה</th><th>מחסנית</th></tr>${rows.map((r,i)=>`<tr><td>${i+1}</td><td><span class="m">${esc(r[0])}</span></td><td>${esc(r[1])}</td><td><div class="stackviz">${(r[2]||'').split('').map(s=>`<span>${s}</span>`).join('')||'⊥'}</div></td></tr>`).join('')}</table></div>
    <p class="verdict ${ok?'y':'n'}">${ok?'✓ מתקבלת: המחסנית ריקה בסוף':'✗ נדחית: '+esc(why)}</p>`;
  };
  m.onchange=()=>{w.value={anbn:'aaabbb',eq:'abbaab',wcw:'abcba'}[m.value];run();}; w.oninput=run; run();
};

let drill = {topic:'all', kind:'all', src:'all', filter:'all', idx:0, deck:null};
function buildDeck(){
  let qs = Q.filter(q=>(drill.topic==='all'||q.t===drill.topic)&&(drill.kind==='all'||q.k===drill.kind)&&(drill.src==='all'||(drill.src==='exam'?q.x!=='prac':q.x==='prac')));
  if(drill.filter==='bad') qs = qs.filter(q=>progress[q.id]==='bad');
  if(drill.filter==='new') qs = qs.filter(q=>!progress[q.id]);
  drill.deck = shuffle(qs); drill.idx = 0;
}
function viewDrill(){
  if(!drill.deck) buildDeck();
  const chip = (group,val,label)=>`<button type="button" class="chip ${drill[group]===val?'on':''}" data-g="${group}" data-v="${val}">${label}</button>`;
  app.innerHTML = `<div class="eyebrow">מצב תרגול</div><h1>תרגול מעורבב</h1>
  <p class="lead">שאלה אחת בכל פעם, בסדר אקראי. כדאי לחזור לכאן אחרי כל נושא כדי לרענן את הקודמים.</p>

  </div>
  <div class="drillbar"><span class="counter" id="ctr"></span><div class="row"><button type="button" class="btn ghost" id="reshuf">ערבב מחדש</button><button type="button" class="btn" id="next">השאלה הבאה ←</button></div></div>
  <div id="slot"></div>`;
  app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{drill[c.dataset.g]=c.dataset.v; buildDeck(); viewDrill();});

function renderSlot(){
  const slot = document.getElementById('slot'), ctr = document.getElementById('ctr'), next = document.getElementById('next');
  const d = drill.deck;
  if(!d.length){ slot.innerHTML = `<div class="box"><p>אין שאלות שמתאימות לסינון הזה.${drill.filter==='bad'?' עוד לא סימנתם אף שאלה כ"לחזור".':''}</p></div>`; ctr.textContent=''; next.disabled=true; return; }
  if(drill.idx>=d.length){ const ok=d.filter(q=>progress[q.id]==='ok').length; slot.innerHTML = `<div class="box"><h3>סיימתם את הסבב</h3><p>${ok} מתוך ${d.length} מסומנות "ידעתי". לחצו "ערבב מחדש" לסבב נוסף, או עברו לסינון "לחזור".</p></div>`; ctr.textContent=`${d.length} / ${d.length}`; next.disabled=true; return; }
  next.disabled=false;
  ctr.textContent = `שאלה ${drill.idx+1} מתוך ${d.length}`;
  slot.innerHTML=''; slot.appendChild(qCard(d[drill.idx]));
}

    ['הוכחת נרוד: «w_i=a^i», ו-z מתאים לכל שפה','5 שאלות פתוחות','nerode'],
    ['שפות ח״ה לא סגורות לחיתוך, למשלים ולמיזוג 1-1','3 שאלות','cfl'],
    ['לינארי ימני ≡ לינארי שמאלי. תלוי הקשר חזק יותר מח״ה','2 שאלות','cfl'],
    ['בר-הלל: «n=2^k» (k = מספר המשתנים בצורת חומסקי)','2 שאלות','cfl'],
    ['A רגולרית ו-«AΔB» רגולרית ⟵ B רגולרית (עם «∪», «∩», «−» לא)','1 שאלה','closure'],
    ['«S·R=S», «S≠∅» ⟵ «ε∈R»','1 שאלה','lang'],
    ['«{a^{3k+5t}}» ⟵ 9 מחלקות. «(m+k) mod 3» ⟵ 7. «#_a>1, #_b<2» ⟵ 7','3 שאלות','nerode']
  ];
  app.innerHTML = `<div class="eyebrow">לקרוא שוב בבוקר המבחן</div><h1>שליפות</h1>
  <p class="lead">העובדות שהופיעו שוב ושוב. אם משהו כאן לא ברור, הקישור מוביל להסבר המלא.</p>
  <div class="box" style="margin-top:18px">${T.map((x,i)=>`<div class="trick"><span class="n">${i+1}</span><div><div>${fm(x[0])}</div><div class="s">${x[1]} · <a href="#t-${x[2]}">${topicById(x[2]).name}</a></div></div></div>`).join('')}</div>`;
}

function viewExams(){
  app.innerHTML = `<div class="eyebrow">ארכיון</div><h1>לפי מבחן</h1>
  <p class="lead">כל מבחן בנפרד, לתרגול בתנאי אמת. 2025ב ו-2026א הם הקרובים ביותר למבנה הנוכחי. שאלות שנשענו על ציור שלא ניתן לשחזר מהקובץ הושמטו.</p>
  <div class="stack" style="margin-top:18px" id="exlist"></div>`;
  const list = document.getElementById('exlist');
  EXAMS.filter(e=>e.id!=='prac').reverse().forEach(ex=>{
    const qs = Q.filter(q=>q.x===ex.id);
    const d = document.createElement('details'); d.className='exam';
    d.innerHTML = `<summary>${ex.name}<span>${qs.length} שאלות · ${ex.fmt}</span></summary>`;
    const st = document.createElement('div'); st.className='stack';
    d.appendChild(st);
    d.addEventListener('toggle',()=>{ if(d.open && !st.childElementCount) qs.forEach(q=>st.appendChild(qCard(q))); });
    list.appendChild(d);
  });
}

/* =====================================================================
   NAV + ROUTER
   ===================================================================== */
document.getElementById('tabs').innerHTML =
  `<a href="#home" data-r="home">סקירה</a><span class="sep"></span>` +
  TOPICS.map((t,i)=>`<a href="#t-${t.id}" data-r="t-${t.id}"><span class="num">${i+1}</span>${t.name}</a>`).join('') +
  `<span class="sep"></span><a href="#drill" data-r="drill">תרגול</a><a href="#tricks" data-r="tricks">שליפות</a><a href="#exams" data-r="exams">מבחנים</a>`;
function route(){
  const h = (location.hash||'#home').slice(1);
  let r = h;
  if(h.startsWith('t-') && topicById(h.slice(2))) viewTopic(h.slice(2));
  else if(h==='drill') viewDrill();
  else if(h==='tricks') viewTricks();
  else if(h==='exams') viewExams();
  else { r='home'; viewHome(); }
  document.querySelectorAll('#tabs a').forEach(a=>{ const on=a.dataset.r===r; a.classList.toggle('on',on); if(on) a.scrollIntoView({block:'nearest',inline:'nearest'}); });
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
</script>
